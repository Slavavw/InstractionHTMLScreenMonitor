      SCRIPT: | 
        '#include HTML_INITSCREEEN
        Option Explicit
        Sub usrg_actOkOnExecute(ByVal Sender)
        '*** Данный код необходим для вызова встроенного обработчика ***
        '*** В случае его удаления возможно нарушение работы системы ***
          Call   Inherited(Sender, "OnExecute", Array(Sender))
        '*** конец кода поддержки встроенного обработчика            ***
          Dim usrg_edHtmlServer, usrg_edInterval, usrg_edPort, Form, FHtmlServer, FServerInterval, FServerPort
          set Form = Sender.OwnerForm
          set usrg_edHtmlServer = Form.FindComponent("usrg_edHtmlServer")
          set usrg_edInterval = Form.FindComponent("usrg_edInterval")
          set usrg_edPort = Form.FindComponent("usrg_edPort")
          
          FHtmlServer = usrg_edHtmlServer.Text
          FServerInterval = usrg_edInterval.Text
          FServerPort = usrg_edPort.Text
          if FServerInterval = "" then FServerInterval = 0
          if FServerPort = "" then FServerPort = 0
          
          call GlobalStorage.WriteString("Option\HTMLServer", "HtmlServer", FHtmlServer)
          call GlobalStorage.WriteInteger("Option\HTMLServer", "ServerInterval", Int(FServerInterval))
          call GlobalStorage.WriteInteger("Option\HTMLServer", "ServerPort", Int(FServerPort))
          
          pf_options.HtmlServer = FHtmlServer
          
          call html_initScreeen(Form)
          
          Sender.OwnerForm.Close
          
        End Sub
        
