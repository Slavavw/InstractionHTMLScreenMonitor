      DISPLAYSCRIPT: | 
        HTML_SCRN_UPDATECHECK
        
      ENTEREDPARAMS: !!binary > 
        U0xQUlBSU1QGAAAAU0VOREVSBgAAAFNFTkRFUgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABGTlNU
        RkxQUg==
      SCRIPT: | 
        Option Explicit
        Function html_scrn_UpdateCheck(Sender)
          dim folder : folder = pf_options.HtmlServer
          Dim oBody, oParam, oDataRow
          set oBody = new JSonObject
          set oParam = new JSonObject
        
          dim Creator, ibsql
          set Creator = New TCreator
          set ibsql = Creator.GetObject(NULL, "TIBSQL", "")
          ibsql.Transaction = gdcBaseManager.ReadTransaction
          ibsql.SQL.Text = "select usr$photo as photo from gd_good g where ID = :goodkey "
        
          Dim MStream
          Set MStream = Creator.GetObject(Null, "TMemoryStream", "")
        
          Dim gdcDetailObject, goodkey
          Set gdcDetailObject = Sender.GetComponent("usrg_gdcCheckLine")
          Dim Bookmark : Bookmark = gdcDetailObject.GetBookmark
          gdcDetailObject.First
          while not gdcDetailObject.Eof
            set oParam = new JSonObject
            call oParam.AddProperty_Simple("count",gdcDetailObject.FieldByName("USR$quantity").AsCurrency )
            set oDataRow = new JsonObject
            goodkey = gdcDetailObject.FieldByName("USR$GOODKEY").AsInteger
            call oDataRow.AddProperty_Simple("RUID_ML",goodkey )
            call oDataRow.AddProperty_Simple("Изделие",gdcDetailObject.FieldByName("USR$NAME").AsString )
            call oDataRow.AddProperty_Simple("Цена",gdcDetailObject.FieldByName("USR$PRICESALE").AsCurrency )
            call oDataRow.AddProperty_Simple("Сумма со скидкой",DecodeQuant(gdcDetailObject.FieldByName("USR$SUMWITHDISCOUNT").AsCurrency) )
            call oDataRow.AddProperty_Simple("Сумма скидки",DecodeQuant(gdcDetailObject.FieldByName("USR$SUMDISCOUNT").AsCurrency) )
            if gdcDetailObject.FieldByName("USR$NUMBER").AsInteger = gdcDetailObject.RecordCount then
               call oDataRow.AddProperty_Simple("Active",true )
            else
               call oDataRow.AddProperty_Simple("Active",false )
            end if
            
            ibsql.Close
            ibsql.ParamByName("goodkey").AsInteger = gdcDetailObject.FieldByName("USR$GOODKEY").AsInteger
            ibsql.ExecQuery
            if Not IsNull(ibsql.FieldByName("PHOTO").AsVariant) then
              ibsql.FieldByName("PHOTO").SaveToStream(MStream)
              MStream.SaveToFile(folder & "\images\menu_name" & goodkey & ".jpg")
              MStream.Clear
              call oDataRow.AddProperty_Simple("PHOTO", "\images\menu_name" & goodkey & ".jpg")
            else
               call oDataRow.AddProperty_Simple("PHOTO", null)
            end if
            call oParam.AddProperty_Object("dataRow",oDataRow )
            call oBody.AddProperty_Object(gdcDetailObject.FieldByName("ID").AsInteger,oParam )
            gdcDetailObject.Next
          wend
          gdcDetailObject.GotoBookmark(Bookmark)
          if oBody.PropertiesCount >0 then
            Dim objStream
            Set objStream = CreateObject("ADODB.Stream")
            objStream.CharSet = "UTF-8" '"windows-1251"
            objStream.open
            objStream.WriteText(replace(oBody.JSON,"\\","/"))
            objStream.SaveToFile folder & "\source\pre_order\pre_order.json", 2
            objStream.Close
            on error goto 0
          end if
        End Function
        
        Private Function DecodeQuant(V)
            dim Sep, sepChange, Arr, S
            Sep = Application.DecimalSeparatorSys
            select case Sep
               case "."
                  sepChange = ","
               case ","
                  sepChange = "."
            end select
            DecodeQuant = Replace(CStr(V), sepChange, Sep)
            Arr = split(DecodeQuant,Sep)
            if Ubound(Arr) <0 then
               DecodeQuant = 0
            else
               if Ubound(Arr) = 0 then
                  DecodeQuant = CInt(Arr(0))
               else
                  dim decim : decim = Arr(1)
                  if len(decim) > 3 then
                     decim = left(decim,3)
                  end if
                  DecodeQuant = CInt(Arr(0)) + decim/10 ^  len(decim)
               end if
            end if
          end function
        
