      SCRIPT: | 
        '#include HTML_SCRN_STARTSERVER
        '#include PF_BTNSELL_CLICK
        option explicit
        sub usrf_pf_screen_cashierOnShow(ByVal Sender)
        '*** Данный код необходим для вызова встроенного обработчика ***
        '*** В случае его удаления возможно нарушение работы системы ***
          call   Inherited(Sender, "OnShow", Array(Sender))
        '*** конец кода поддержки встроенного обработчика            ***
          Sender.GetComponent("usrg_Edit").SetFocus
          if pf_Options.FHideCursor then
            Screen.Cursor = -1
          end if
          call html_scrn_StartServer
          Sender.GetComponent("usrg_Edit").SetFocus
          call pf_btnSell_Click(Sender)
        end sub
        
