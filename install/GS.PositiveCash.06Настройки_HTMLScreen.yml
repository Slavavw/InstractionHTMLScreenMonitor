                    exit Function
                  End If
                  Call pf_UpQuantInPrice(gdcDetailObject, _
                    QuantC - gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency, _
                    gdcDetailObject.Transaction)
                End If
        
                ibsql.Close
                Set ibsql.Transaction = gdcBaseManager.ReadTransaction
                ibsql.SQL.Text =  _
                  "SELECT " & _
                  "  g.USR$PF_ISFRAC AS ISFRAC " & _
                  "FROM GD_GOOD g " & _
                  "WHERE g.ID = :GoodKey "
                ibsql.ParamByName("GoodKey").AsInteger = gdcDetailObject.FieldByName("USR$GOODKEY").AsInteger
                ibsql.ExecQuery
        
                If pf_Options.IsControlFrac And ibsql.FieldByName("ISFRAC").AsInteger = 0 And (QuantC <> Round(QuantC)) Then
                  Call pf_ShowErrorMessage("Количество штучного товара не может быть дробным")
