      SCRIPT: | 
        Option Explicit
        Sub usrf_htmlScreen_SettingOnShow(ByVal Sender)
        '*** Данный код необходим для вызова встроенного обработчика ***
        '*** В случае его удаления возможно нарушение работы системы ***
          Call   Inherited(Sender, "OnShow", Array(Sender))
        '*** конец кода поддержки встроенного обработчика            ***
          Dim FHtmlServer, FServerInterval, FServerPort
          FHtmlServer              = GlobalStorage.ReadString("Option\HTMLServer", "HtmlServer", "")
          FServerInterval          = GlobalStorage.ReadInteger("Option\HTMLServer", "ServerInterval", 5000)
          FServerPort              = GlobalStorage.ReadInteger("Option\HTMLServer", "ServerPort", 500)
          
          Dim usrg_edHtmlServer, usrg_edInterval, usrg_edPort
          
          set usrg_edHtmlServer = Sender.FindComponent("usrg_edHtmlServer")
          set usrg_edInterval = Sender.FindComponent("usrg_edInterval")
          set usrg_edPort = Sender.FindComponent("usrg_edPort")
          
          usrg_edHtmlServer.Text = FHtmlServer
          usrg_edInterval.Text = FServerInterval
          usrg_edPort.Text = FServerPort
          
          Dim dsPhoto
          set dsPhoto = Sender.GetComponent("usrg_IBDataSet")
          dsPhoto.Open
          
          Dim usrg_chkGitLoad
          set usrg_chkGitLoad = Sender.GetComponent("usrg_chkGitLoad")
          usrg_chkGitLoad.Checked = false
        
          Dim dstColumn
          Set dstColumn = Sender.GetComponent("usrg_dstColumn")
          dstColumn.SelectSQL.Text = _
          " select first 1 " & vbCrLf & _
          " g.name as GoodName, " & vbCrLf & _
          " 1 as USR$quantity, " & vbCrLf & _
          " 1*pl.usr$price as USR$SUMWITHDISCOUNT, " & vbCrLf & _
          " pl.usr$price as FullCost, " & vbCrLf & _
          " '' as outputStr, "& vbCrLf & _
          " g.USR$PHOTO PHOTO " & vbCrLf & _
          "  From " & vbCrLf & _
          " usr$pf_pricelist pl " & vbCrLf & _
          " join gd_good g on g.id = pl.usr$goodkey " & vbCrLf & _
          " join GD_GOODGROUP gg on gg.id = g.groupkey " & vbCrLf & _
          " JOIN GD_RUID R ON R.ID = g.ID " & vbCrLf & _
          " JOIN GD_RUID r_ml on r_ml.ID = gg.id " & vbCrLf & _
          " where not (gg.name containing '00. Системное') " & vbCrLf & _
          " ORDER BY g_s_delchar(gg.alias), gg.name, g_s_delchar(g.alias), g.name "
          dstColumn.Open
          
          Dim Grid : Set Grid = Sender.GetComponent("usrg_grdColumn")
          dim ColumnList, SizeList
          ColumnList = array( array("GoodName","Товар"), array("USR$quantity","количество"), array("USR$SUMWITHDISCOUNT","Стоимость"),array("FullCost","Цена"),array("outputStr","Описание"),array("PHOTO","Изображение"))
          SizeList = array(25, 25, 25, 25, 25, 25)
          Dim i, j, isFound
          for i = 0 to Grid.Columns.Count - 1
            j = 0
            isFound = false
           ' Grid.Columns.Items(i).Visible = False
            while j <= UBound(ColumnList) and not isFound
              if UCase(Grid.Columns.Items(i).FieldName) = UCase(ColumnList(j)(0)) then
                isFound = true
              else
                j = j + 1
              end if
            wend
            if isFound then
              Grid.Columns.Items(i).Title.Caption = ColumnList(j)(1)
            '  Grid.Columns.Items(i).Visible = True
              Grid.Columns.Items(i).Width = SizeList(j)/100 * Grid.Width
            end if
          next
        End Sub
        
