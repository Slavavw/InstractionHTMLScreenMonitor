      ENTEREDPARAMS: !!binary > 
        U0xQUlBSU1QGAAAAU0VOREVSBgAAAFNFTkRFUgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABGTlNU
        UFJTVAYAAABBQ1RJT04GAAAAQUNUSU9OAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEZOU1RGTFBS
      SCRIPT: | 
        '#include HTML_SCRN_CLEAR
        option explicit
        sub usrf_pf_screen_cashierOnClose(ByVal Sender, ByRef Action)
        '*** Данный код необходим для вызова встроенного обработчика ***
        '*** В случае его удаления возможно нарушение работы системы ***
          Dim ParamArr(1)
          Set   ParamArr(0) = Sender
          ParamArr(1) = Action
          call   Inherited(Sender, "OnClose", ParamArr)
          Action.Value = ParamArr(1)
        '*** конец кода поддержки встроенного обработчика            ***
        
        
          On Error Resume Next
            
          ecr_PD.ShowDefaultMessage
          
        
          if pf_Options.FHideCursor then
            Screen.Cursor = crDefault
          end if
        
          if not IBLogin.IsUserAdmin then
            call Application.Terminate
          end if
          
          If pf_Options.ShowUserGridOptions Then
            Dim Creator : Set Creator = New TCreator
            Dim pth
            pth = GlobalStorage.BuildComponentPath(Sender, "") & "\Grids"
        
            Dim S : Set S = Creator.GetObject(nil, "TMemoryStream", "")
            Dim Grid : Set Grid = Sender.FindComponent("usrg_gsIBGrid1")
        
            Grid.SaveToStream(S)
            Call GlobalStorage.WriteStream(pth, "usrg_gsIBGrid", S)
          End If
          call html_scrn_Clear()
        
        end sub
        
