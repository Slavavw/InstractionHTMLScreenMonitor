        Class BankCurrencyInfo_Class
          Private m_ID
          Private m_CODE
          Private m_ISO
          Private m_DECDIGITS
          
          Public Default Function Init(ByVal CurrKey)
            Dim Creator : Set Creator = New TCreator
            Dim ibsql
            Set ibsql = Creator.GetObject(Null, "TIBSQL", "TVBpfOptions")
            ibsql.Transaction = gdcBaseManager.ReadTransaction
            ibsql.SQL.Text = _
              "SELECT " & _
              "  ID, " & _
              "  CODE, " & _
              "  ISO, " & _
              "  DECDIGITS " & _
              "FROM GD_CURR " & _
              "WHERE ID = :ID "
            ibsql.ParamByName("ID").AsInteger = CurrKey
            ibsql.ExecQuery
        
            m_ID = ibsql.FieldByName("ID").AsVariant
            m_CODE = ibsql.FieldByName("CODE").AsVariant
            m_ISO = ibsql.FieldByName("ISO").AsVariant
            m_DECDIGITS = ibsql.FieldByName("DECDIGITS").AsVariant
            
            'Call Creator.DestroyAllObjects
            
            Set Init = Me
          End Function
          
          Public Property Get ID
            ID = m_ID
          End Property
          
          Public Property Get CODE
            CODE = m_CODE
          End Property
          
          Public Property Get ISO
            ISO = m_ISO
          End Property
          
          Public Property Get DECDIGITS
            DECDIGITS = m_DECDIGITS
          End Property
        
          Private Sub Class_Terminate
          End Sub
        End Class
        
