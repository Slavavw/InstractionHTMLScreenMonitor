      USEDEBUGINFO: ~
      EDITIONDATE: 2025-06-24T20:07:13+03:00
      DISPLAYSCRIPT: | 
        PF_INSERTGOODPOSITION
        ISMIXEDMARKEDANDUNMARKED
        
      ENTEREDPARAMS: !!binary > 
        U0xQUlBSU1QIAAAAR09PRElORk8IAAAAR09PRElORk8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        Rk5TVFBSU1QJAAAAR0RDT0JKRUNUCQAAAEdEQ09CSkVDVAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        AABGTlNUUFJTVA8AAABHRENERVRBSUxPQkpFQ1QPAAAAR0RDREVUQUlMT0JKRUNUAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAEZOU1RQUlNUCwAAAFRSQU5TQUNUSU9OCwAAAFRSQU5TQUNUSU9OAAAA
        AAAAAAAAAAAAAAAAAAAAAAAAAAAAAEZOU1RQUlNUBgAAAElTU0NBTgYAAABJU1NDQU4AAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAAAARk5TVFBSU1QPAAAAU1VNV0lUSERJU0NPVU5UDwAAAFNVTVdJVEhE
        SVNDT1VOVAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABGTlNURkxQUg==
      SCRIPT: | 
        '#include PF_ISCONTRALMARKINCHECKLINE
        '#include PF_INSERTTRACERCHECKLINE
        '#include PF_SHOWERRORMESSAGE
        '#include PFS_SHOWREFERENCEFORM
        '#include PF_UPQUANTINPRICE
        '#include PF_SETGRID
        '#include PF_PRINTER_PRINTPOSITION
        option explicit
        function pf_InsertGoodPosition(GoodInfo, gdcObject, gdcDetailObject, Transaction, IsScan, SumWithDiscount)
          pf_InsertGoodPosition = -1
        
          If Not gdcDetailObject.Active Then Exit Function
        
          if gdcDetailObject.OwnerForm.Variables("LineKey") > 0 then
            if not pf_options.PrintAfter then
              call pf_Printer_PrintPosition(gdcDetailObject)
            end if
          end if
          dim CheckId, CheckType
          CheckID = gdcObject.OwnerForm.Variables("CheckType")
          if CheckID > 0 then
            CheckType = CheckID
          else
            CheckType = null
          end if
          dim EnterType
          if IsScan then
            EnterType = gdcBaseManager.GetIDByRUIDString(pf_entertype_scanner)
          else
            EnterType = gdcBaseManager.GetIDByRUIDString(pf_entertype_keyboard)
          end if
        
          if IsNull(SumWithDiscount) then SumWithDiscount = GoodInfo.PriceSale * GoodInfo.Quantity
        
          if gdcDetailObject.RecordCount = 1 then
            call pf_SetGrid(gdcObject.OwnerForm, 22)
          end if
        
          if pf_Options.FSeller = 0 and pf_Options.FSetSeller   then
            ' Запрашиваем продавца
            if gdcObject.OwnerForm.Variables("CheckType") =  gdcBaseManager.GetIDBYRUIDString(pf_checktype_sell) then
              pf_Options.FSeller =  pfs_ShowReferenceForm(null)
            end if
          end if
        
          Dim QuantC, QuantCInt
        'Отключено на время тестирования работы маркировки товаров
        '  if (pf_Options.IsSumPosition) and  gdcDetailObject.Locate( "USR$GOODKEY",GoodInfo.GoodKey, False) then
          if pf_Options.IsSumPosition and gdcDetailObject.Locate( "USR$GOODKEY",GoodInfo.GoodKey, False) then
             gdcDetailObject.Edit
        
             If IsMixedMarkedAndUnmarked(gdcDetailObject, GoodInfo) then
                gdcDetailObject.Cancel
                Exit Function
             End If
        
             QuantC = CCur(gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency + 1)
             QuantCInt = Abs(CCur(QuantC * gdcDetailObject.FieldByName("USR$PRICESALE").AsCurrency) )
             if Abs(QuantC) > 1000000 Or QuantCInt > 900000000 then
                Call pf_ShowErrorMessage("Невозможно рассчитать чек. Слишком большие суммы")
                Call pf_ActionsList.AddToLog(16, gdcObject.ID, gdcDetailObject.ID, Null, "Неверное кол-во " & QuantC, 1)
                Exit Function
             End If
        
             gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency  = gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency + pf_Options.Precision(GoodInfo.Quantity)
          else
              gdcDetailObject.Insert
        
              If IsMixedMarkedAndUnmarked(gdcDetailObject, GoodInfo) then
                gdcDetailObject.Cancel
                Exit Function
              End If
        
              gdcDetailObject.FieldByName("USR$NAME").AsVariant = GoodInfo.GoodName
              gdcDetailObject.FieldByName("USR$GOODKEY").AsInteger = GoodInfo.GoodKey
              gdcDetailObject.FieldByName("USR$BARCODE").AsVariant = GoodInfo.BarCode
              gdcDetailObject.FieldByName("USR$ALIAS").AsVariant = GoodInfo.Alias
              gdcDetailObject.FieldByName("USR$ENTERTYPEKEY").AsVariant = EnterType
              gdcDetailObject.FieldByName("USR$CHECKTYPE").AsVariant = CheckType
              gdcDetailObject.FieldByName("USR$CASHIERKEY").AsVariant = gdcObject.FieldByName("USR$CASHIERKEY").AsVariant
              if pf_Options.FSeller >0 then
                 gdcDetailObject.FieldByName("USR$SELLERKEY").AsVariant = pf_Options.FSeller
              end if
              gdcDetailObject.FieldByName("USR$PRICE").AsVariant = pf_Options.RoundCost(GoodInfo.Price)
              gdcDetailObject.FieldByName("USR$PRICESALE").AsVariant = pf_Options.RoundCost(GoodInfo.PriceSale)
              gdcDetailObject.FieldByName("USR$MASTERKEY").AsInteger = gdcObject.ID
              if GoodInfo.ConcernedLineKey > 0 then
                 gdcDetailObject.FieldByName("USR$CONCCHECKLINEKEY").AsInteger = GoodInfo.ConcernedLineKey
              end if
              gdcDetailObject.FieldByName("USR$PRICEINT").AsVariant  = GoodInfo.PriceKey
              gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency  = pf_Options.Precision(GoodInfo.Quantity)
              gdcDetailObject.FieldByName("USR$SECTION").AsVariant   = GoodInfo.Section
              gdcDetailObject.FieldByName("USR$ISDISC").AsVariant    = GoodInfo.IsDisc
              gdcDetailObject.FieldByName("USR$SUMDISCOUNT").AsVariant = GoodInfo.SumDiscount
              gdcDetailObject.FieldByName("USR$CODEDEPOT").AsVariant = GoodInfo.DepKey
              gdcDetailObject.FieldByName("USR$TAXCODE").AsVariant   = GoodInfo.TaxCode
          end if
          Dim Creator
          Set Creator = New TCreator
        
          ' проверка на большие суммы
          Err.Clear
          on error resume next
            Dim BigSumValue
            BigSumValue = 0
            dim qBigRetSum
            set qBigRetSum = Creator.GetObject(nil, "TIBSQL", "pfInsertGoodPosition")
            qBigRetSum.Transaction = gdcDetailObject.Transaction
            qBigRetSum.SQL.Text = _
              "SELECT " & _
              "  (SUM(l.USR$PRICE * l.USR$QUANTITY)) AS S " & _
              "FROM USR$PF_CHECKLINE l " & _
              "WHERE l.USR$MASTERKEY = :ID "
            qBigRetSum.ParamByName("ID").AsInteger = gdcObject.ID
            qBigRetSum.ExecQuery
            BigSumValue = qBigRetSum.FieldByName("S").AsCurrency  + _
               gdcDetailObject.FieldByName("USR$SUM").AsCurrency
            if Err.Number <> 0 or Abs(BigSumValue) > 900000000 then
              Call pf_ShowErrorMessage("Невозможно рассчитать чек. Слишком большие суммы")
              gdcDetailObject.Cancel
              exit function
            end if
          on error goto 0
          gdcDetailObject.Post
          if GoodInfo.ContralMark <> "" then
            Call pf_InsertTracerCheckline(GoodInfo, gdcDetailObject, Transaction)
          end if
          gdcDetailObject.CloseOpen
        
          If pf_Options.ControlRemains then
            If gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").IsNull Then
              '+1 для добавления товара сканером, минус количество в строке - для сторнирования
              dim DeltaQuantity: DeltaQuantity = GoodInfo.Quantity
              Call pf_UpQuantInPrice(gdcDetailObject, DeltaQuantity, gdcDetailObject.Transaction)
              'Call pf_UpQuantInPrice(gdcDetailObject, gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency, gdcDetailObject.Transaction)
            Else
              'если это оплата отложенного чека без дополнительных товаров, то не менять кол-ва
              Dim ibsql
              Set ibsql = Creator.GetObject(Null, "TIBSQL", "pfInsertGoodPosition")
              ibsql.Transaction = gdcBaseManager.ReadTransaction
              ibsql.SQL.Text = _
                "SELECT " & _
                "  cl.USR$GOODKEY AS GOODKEY, " & _
                "  SUM(cl.USR$QUANTITY) AS QUANTITY " & _
                "FROM " & _
                "  USR$PF_CHECK c " & _
                "  JOIN USR$PF_CHECKLINE cl ON cl.USR$MASTERKEY = c.ID " & _
                "WHERE " & _
                "  c.ID = :ID " & _
                "  AND c.USR$CHECKKEY = :CheckType " & _
                "GROUP BY 1 "
              ibsql.ParamByName("ID").AsInteger = _
                gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").AsInteger
              ibsql.ParamByName("CheckType").AsInteger = _
                gdcBaseManager.GetIDByRUIDString(pf_checktype_pending)
              ibsql.ExecQuery
        
        
              Dim Quantity
              Quantity = gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency
              While Not ibsql.Eof
                If gdcDetailObject.Locate("USR$GOODKEY", ibsql.FieldByName("GOODKEY").AsInteger, False) Then
                  Quantity = gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency - ibsql.FieldByName("QUANTITY").AsCurrency
                End If
                ibsql.Next
              Wend
              Call pf_UpQuantInPrice(gdcDetailObject, Quantity, gdcDetailObject.Transaction)
            End If
          end if
          'Call Creator.DestroyAllObjects
          pf_InsertGoodPosition = gdcDetailObject.ID
        end function
        
        
        Function IsMixedMarkedAndUnmarked(gdcDetailObject, GoodInfo)
          '777 20.06.25
          'Проверим, нет ли попытки смешивать в позиции товары c маркировкой и без
          IsMixedMarkedAndUnmarked = true
        
          Dim ContralMarkInCheckLine
          ContralMarkInCheckLine = pf_IsContralMarkInCheckLine(gdcDetailObject.ID, gdcDetailObject.Transaction)
          if (ContralMarkInCheckLine and GoodInfo.ContralMark = "" and not (gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency = -1 * pf_Options.Precision(GoodInfo.Quantity))) or _
             (Not ContralMarkInCheckLine and GoodInfo.ContralMark <> "" and gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency <> 0) _
          then
             Call pf_ShowErrorMessage("Нельзя вносить один и тот же товар с маркировкой и без маркировки!")
             Call pf_ActionsList.AddToLog(81, Null, Null, Null, "Нельзя вносить один и тот же товар с маркировкой и без маркировки!", 1)
             Exit Function
          end if
        
          IsMixedMarkedAndUnmarked = false
        end function
        
