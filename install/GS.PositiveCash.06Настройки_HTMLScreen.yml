      DISPLAYSCRIPT: | 
        PF_BTNTOTAL
        
      ENTEREDPARAMS: !!binary > 
        U0xQUlBSU1QGAAAAU0VOREVSBgAAAFNFTkRFUgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABGTlNU
        RkxQUg==
      SCRIPT: | 
        '#include HTML_SCRN_CLEAR
        '#include FORMATSUMM
        '#include ALPHA_CANCELPAYMENT
        '#include ALPHA_GETPAYMENT
        '#include PF_REFUSEDCHOOSECERTIFICATE
        '#include UDS_CANCELPAYMENT
        '#include UDS_GETCHECKTRANSACTION
        '#include UDS_GETPAYMENT
        '#include PF_SHOWGOODMESSAGE
        '#include PFS_TEMPTABLE_DELETE
        '#include PF_SAVECHECKSUMMARY
        '#include OPLATI_CANCELPAYMENT
        '#include PF_PRINTCOUPONS
        '#include OPLATI_GETPAYMENT
        '#include SETSHIFTSTATUS
        '#include PF_SHOWERRORMESSAGE
        '#include PF_ISSYNCHR
        '#include ISDISCFORSTAFF
        '#include PF_PAYMENT
        '#include PF_RETURN
        '#include PD_EXPORTCHECKQ
        '#include PF_BTNSELL_CLICK
        '#include PF_PRINTER_PRINTPOSITION
        '#include PF_PRINTAFTER
        '#include PF_PRINTER_PRINTSUMMARY
        option explicit
        Function pf_btnTotal(Sender)
        
          If Sender.OwnerForm.Variables("CheckOpen") <= 0 Then
            Call pf_ShowErrorMessage("Чек не открыт!")
            Exit Function
          End If
          
          Dim gdcObject, form, Sum, QuantC, qSum, SumD, Res
          Dim gdcDetailObject
          Set gdcDetailObject = Sender.OwnerForm.GetComponent("usrg_gdcCheckLine")
          Set gdcObject = Sender.OwnerForm.gdcObject
          
          'очістіть поля оплат по карте(на случай, еслі форма вызвана во второй раз)
          gdcObject.Edit
          gdcObject.FieldByName("USR$CARDPAY").Clear
          gdcObject.FieldByName("USR$SUMCARD").Clear
          gdcObject.Post
          ' пересчитать скидки
        '  if not gdcDetailObject.EOF then
        '    gdcDetailObject.Edit
        '    gdcDetailObject.Post
        '  end if
        
          ' итоговая сумма чека
          QuantC = gdcObject.FieldByName("USR$SUMCHECK").AsCurrency
          If QuantC = 0 Then
            If Not pf_Options.PermitNullPrice Then
        '      Call pf_ShowErrorMessage("Неверно ИТОГО!")
              Exit Function
            End If
          End If
          
          ''' Проверка скидочного лимита
          If gdcObject.FieldByName("USR$DISCOUNT_LIMITKEY").AsInteger > 0 _
             And gdcObject.FieldByName("USR$CARDKEY").AsInteger > 0 _
             And Sender.OwnerForm.Variables("CheckType") = _
                   gdcBaseManager.GetIDBYRUIDString(pf_checktype_Sell) Then
        
            Dim discountLimit
            Set discountLimit = New TVB_mn_Limit
            discountLimit.Init(gdcObject.FieldByName("USR$DISCOUNT_LIMITKEY").AsInteger)
             
            ''' если отключен
            If discountLimit.Disabled Then
              Call pf_ShowErrorMessage(discountLimit.ContactName & vbCrLf &  "Заблокирован лимит скидки")
              Exit Function
            End If
            
            ''' если вне периода действия
            If Not (discountLimit.DateBegin <= Date And discountLimit.DateEnd >= Date) Then
              If discountLimit.DateBegin > Date Then
                Call pf_ShowErrorMessage("Лимит скидки действует с " & discountLimit.DateBegin)
                Exit Function
              End If
              
              If discountLimit.DateEnd < Date Then
                Call pf_ShowErrorMessage("Лимит скидки действует до " & discountLimit.DateEnd)
                Exit Function
              End If
            End If
        
            ''' если лимит ограничен
            If (Not discountLimit.IsUnlimited) Then
        
              Dim SumDiscount
              SumDiscount = gdcObject.FieldByName("USR$SUMDISCOUNT").AsCurrency
              
              If SumDiscount > discountLimit.Balance Then
                Call pf_ShowErrorMessage("Недостаточный остаток лимита скидки" & vbCrLf & " Доступно: " & FormatSumm(discountLimit.Balance) & " руб.")
                Exit Function
              End If
            End If
          End If
          
          
          ' если есть сумма сертификата, заполним ее.
          ' Если сертификат больше суммы чека, то в сумму сертификата запишем сумму чека (весь чек покрывается сертификатом)
          If Sender.OwnerForm.Variables("CertificateBalanceInCheck") > 0 Then
            gdcObject.Edit
            If Sender.OwnerForm.Variables("CertificateBalanceInCheck") >= gdcobject.FieldByName("USR$SUMCHECK").AsCurrency Then
              gdcObject.FieldByName("USR$SUMCERTIFICATE").AsCurrency = _
                gdcobject.FieldByName("USR$SUMCHECK").AsCurrency
            Else
              gdcObject.FieldByName("USR$SUMCERTIFICATE").AsCurrency = _
                Sender.OwnerForm.Variables("CertificateBalanceInCheck")
            End If
            gdcObject.Post
          End If
        
          Dim Creator : Set Creator = New TCreator
        
          Dim ibsql
          Set ibsql = Creator.GetObject(null, "TIBSQL", "pfbtnTotal")
        
          ' еслі возврат - сделать возврат по накопітельным картам
          If Sender.OwnerForm.Variables("CheckType") = _
            gdcBaseManager.GetIDBYRUIDString(pf_checktype_return) Then
            Sender.OwnerForm.GetComponent("usrg_Edit").Text = _
              - CStr(QuantC)
        
          End If
        
          Dim  sqlCashier, Tr
          Set Tr = Sender.OwnerForm.GetComponent("usrg_Transa")
          If Not Tr.InTransaction Then tr.StartTransaction
        
          ' открыть денежный ящик
          If pf_options.PrintFiscalCheck And pf_Options.OpenDrawer Then
            Call ecr_GlobalPrinter.OpenDrawer
            
            Call SetShiftStatus(Sender)
            
            If ecr_GlobalPrinter.ErrorCode <> "0" Then
              Sender.OwnerForm.GetComponent("usrg_StBar").Panels.Items(0).Text = ecr_GlobalPrinter.ErrorDescription
              Sender.OwnerForm.GetComponent("usrg_mStatus").Text = ecr_GlobalPrinter.ErrorDescription
            End If
          End If
        
          'Возврта отложенного чека(аннулирование)
        '    If Sender.OwnerForm.Variables("CheckType") = _
        '      gdcBaseManager.GetIDBYRUIDString(pf_checktype_return) And _
        '      gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").AsInteger = _
        '        gdcBaseManager.GetIDBYRUIDString(pf_checktype_pending) Then
        '
        '      If pf_options.ControlRemains Then
        '        gdcDetailObject.First
        '        while gdcDetailObject.Eof
        '          Call pf_UpQuantInPrice(gdcDetailObject, gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency, gdcDetailObject.Transaction)
        '          gdcDetailObject.Next
        '        wend
        '      End If
        '    End If
        
        
          If Sender.OwnerForm.Variables("CheckType") = _
            gdcBaseManager.GetIDBYRUIDString(pf_checktype_sell) Then
              Dim ans
              Call gdcBaseManager.ExecSingleQueryResult(_
                "SELECT conc.ID " & _
                "FROM USR$PF_CHECK c " & _
                "JOIN USR$PF_CHECK conc ON conc.ID = c.USR$CONCERNEDCHECKKEY " & _
                "WHERE " & _
                "  conc.USR$CHECKKEY = :CHECKTYPE " & _
                "  AND c.ID = :ID ", _
              Array(gdcBaseManager.GetIDBYRUIDString(pf_checktype_pending), gdcObject.ID), ans, Tr)
              If Not isEmpty(ans) Then
                If Not isNull(ans(0,0)) Then
                  Call gdcBaseManager.ExecSingleQueryParam(_
                    "DELETE FROM USR$PF_PENDINGCHECK WHERE USR$CHECKKEY = :ID ", _
                    ans(0,0), Tr)
                End If
              End If
          End If
        
          ' суммы возвратов по связанному чеку, если были
          Dim result, sumpay, sumcard, SumCertificate, SumCredit, SumAdvance, SumBonus, SumOplati, SumBonusUDS, SumALPHA
          Call gdcBaseManager.ExecSingleQueryResult(_
            "SELECT " & _
            "  SUM(S1), " & _
            "  SUM(S2), " & _
            "  SUM(S3), " & _
            "  SUM(S4), " & _
            "  SUM(S5), " & _
            "  SUM(S6), " & _
            "  SUM(S7), " & _
            "  SUM(S8), " & _
            "  SUM(S9)  " & _
            "FROM " & _
