                        qSum.ExecQuery
                        
                        Dim PercNew
                        PercNew = qSum.FieldByName("USR$PERCENT").AsCurrency
        
                        If PercNew > PercOld Then
                          'If PercNew > 0 Then
                           Call pf_ShowGoodMessage("Размер скидки изменился" & vbCrLf & _
                           "с " & PercOld & "% на " & qSum.FieldByName("USR$PERCENT").AsCurrency & "%")
                           
                           Call gdcBaseManager.ExecSingleQueryParam(_
                            "  UPDATE USR$PF_CARD c " & _
                            "  SET c.USR$PERCENT = :Perc, USR$DELIVERED = :USR$DELIVERED " & _
                            "  WHERE c.ID = :cardkey ", Array(_
                            PercNew, 0, gdcObject.FieldByName("USR$DCARDKEY").AsInteger), Tr)
                          'End If
                        End If
                      End If
                    End If
                  End If
                End If
              End If
            Else
              If gdcObject.VariableExists("CardKey") Then
                If gdcObject.Variables("CardKey") > 0 Then
                  Sender.OwnerForm.GetComponent("usrg_lblOperationType1").Caption = ""
                  Sender.OwnerForm.GetComponent("usrg_lblOperationType3").Caption = ""
                  gdcObject.Edit
                  gdcObject.FieldByName("USR$DCARDKEY").AsVariant = null
                  gdcObject.Post
                  gdcObject.Variables("CardKey") = 0
                  If Not gdcDetailObject.eof Then
                    gdcDetailObject.Edit
                    gdcDetailObject.Post
                    Sender.OwnerForm.GetComponent("usrg_lbQ").Caption = gdcDetailObject.FieldByName("USR$QUANTITY").AsString
                    Sender.OwnerForm.GetComponent("usrg_lbSum").Caption = gdcDetailObject.FieldByName("USR$SUMWITHDISCOUNT").AsString
                    Sender.OwnerForm.GetComponent("usrg_lbPrice").Caption = gdcDetailObject.FieldByName("USR$PRICESALE").AsString
                  End If
                End If
              End If
        
        
              If Assigned(Form) Then Call Form.Destroy
              Set Form = Nothing
              'Call Creator.DestroyAllObjects
              
              Exit Function
            End If
          End If
          
          If Assigned(Form) Then Call Form.Destroy
          Set Form = Nothing
        
         ' Банковский терминал
         ''#include PF_CARDSUM
        '    If Sender.OwnerForm.Variables("CheckType") = _
        '        gdcBaseManager.GetIDBYRUIDString(pf_checktype_return) Then
        '      If Sender.OwnerForm.Variables("cardsum") = 0 Then
        '        Sender.OwnerForm.Variables("cardsum") = _
        '          pf_CardSum(Sender.OwnerForm.gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").AsInteger)
        '     End If
        '   End If
        
        '(((gdcObject.FieldByName("ReturnedAllSum").AsCurrency - sumpay) - _
        '        (gdcObject.FieldByName("ReturnedCardSum").AsCurrency - sumcard))  < Abs(QuantC) ) And _
        '        ((gdcObject.FieldByName("ReturnedAllSum").AsCurrency - sumpay) <> (gdcObject.FieldByName("ReturnedCardSum").AsCurrency - sumcard))
        '
            Dim CardSum
            If NeedPayForm Then
              'CardSum = CCur(Sender.OwnerForm.Variables("cardsum"))
              CardSum = gdcObject.FieldByName("USR$SUMCARD").AsCurrency
            Else
              If (gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").AsInteger > 0) Then
                If gdcObject.FieldByName("ReturnedAllSum").AsCurrency - gdcObject.FieldByName("ReturnedCardSum").AsCurrency - Abs(QuantC) > 0 Then
                  CardSum = 0
                Else
                  CardSum = Abs(gdcObject.FieldByName("ReturnedAllSum").AsCurrency - gdcObject.FieldByName("ReturnedCardSum").AsCurrency - Abs(QuantC))
                End If
              End If
        '         '#include PF_RETURNCARDSUM
        '        CardSum = pf_ReturnCardSum(Sender, CCur(Sender.OwnerForm.Variables("cardsum")))
              'Sender.OwnerForm.Variables("cardsum") = CardSum
              gdcObject.Edit
              gdcObject.FieldByName("USR$SUMCARD").AsCurrency = CardSum
              gdcObject.post
            End If
        
          'Если использовали банковскую карту
          If Abs(gdcObject.FieldByName("USR$SUMCARD").AsCurrency) > 0 And gdcObject.FieldByName("USR$CARDPAY").AsInteger = gdcBaseManager.GetIDByRUIDString(pf_KindPayment_Card) Then
            If Sender.OwnerForm.Variables("CheckType") = _
              gdcBaseManager.GetIDBYRUIDString(pf_checktype_sell) Then
              If Not pf_Payment(Sender.OwnerForm, Abs(gdcObject.FieldByName("USR$SUMCARD").AsCurrency), gdcObject.ID) Then
                'Call Creator.DestroyAllObjects
                Exit Function
              End If
        
            End If
        
            If Sender.OwnerForm.Variables("CheckType") = _
              gdcBaseManager.GetIDBYRUIDString(pf_checktype_return) Then
              If Not pf_Return(Sender, CardSum, gdcObject.ID) Then
                'Call Creator.DestroyAllObjects
                Exit Function
              End If
            End If
          End If
        
          If Not Sender.OwnerForm.FindComponent("usrg_gdcCheckline").Active Then _
            Sender.OwnerForm.FindComponent("usrg_gdcCheckline").Active = True
        
          ' чек возврата БЕЗ смешанных форм оплаты (только безнал или только наличные)
          If (Sender.OwnerForm.Variables("CheckType") = _
              gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) And (Not NeedPayForm) Then
            'чек продажи был оплачен полностью безналом. По безналу и вернем
            If (gdcObject.FieldByName("ReturnedAllSum").AsCurrency = _
               gdcObject.FieldByName("ReturnedCardSum").AsCurrency) And _
               (gdcObject.FieldByName("ReturnedAllSum").AsCurrency <> 0) Then
              gdcObject.Edit
              gdcObject.FieldByName("USR$SUMCARD").AsCurrency = gdcObject.FieldByName("USR$SUMCHECK").AsCurrency
              gdcObject.FieldByName("USR$CARDPAY").AsVariant = gdcObject.FieldByName("ReturnCardKey").AsVariant
              gdcObject.FieldByName("USR$SUMPAY").Clear
              gdcObject.Post
            ' только наличные
            Else
              gdcObject.Edit
              gdcObject.FieldByName("USR$SUMPAY").AsCurrency = gdcObject.FieldByName("USR$SUMCHECK").AsCurrency
              gdcObject.Post
            End If
          End If
        
          If isDiscForStaff(gdcObject.FieldByName("USR$CARDKEY").AsInteger) Then
            Call gdcBaseManager.ExecSingleQueryParam(_
              "UPDATE USR$PF_CHECKLINE cl " & _
              "SET " & _
              "  cl.USR$PRICESALE = :PEICESALE, " & _
              "  cl.USR$SUMDISCOUNT = cl.USR$SUM /*- cl.USR$QUANTITY * :PRICESALE*/, " & _
              "  cl.USR$PERCENTDISCOUNT = :PERC, " & _
              "  cl.USR$SUMWITHDISCOUNT = 0/*cl.USR$QUANTITY * :PRICESALE*/, " & _
              "  cl.USR$ISDISC = 1 " & _
              "WHERE " & _
              "  cl.USR$MASTERKEY = :MASTERKEY ", _
              Array(0, 100, gdcObject.FieldByName("ID").AsInteger), Tr)
        
            Dim qSumDisc
            Set qSumDisc = Creator.GetObject(nil, "TIBSQL", "pfbtnTotal")
            qSumDisc.Transaction = Tr
            qSumDisc.SQL.Text = _
              "SELECT SUM(l.USR$SUMDISCOUNT)  AS S FROM USR$PF_CHECKLINE l " & _
              "WHERE COALESCE(l.USR$ISDISC, 0) = 1 AND l.USR$MASTERKEY = :mkey "
            qSumDisc.ParamByName("mkey").AsInteger = gdcObject.ID
            qSumDisc.ExecQuery
        
            gdcObject.Edit
            gdcObject.FieldByName("USR$SUMDISCOUNT").AsCurrency = _
              qSumDisc.FieldByName("S").AsCurrency
            gdcObject.Post
          End If
        
          ''Если выбрана форма оплаты с признаком "не печатать"
          Dim isNonFiscal : isNonFiscal = False
          ibsql.Transaction = gdcObject.Transaction
          ibsql.SQL.Text = _
            "SELECT " & _
            "  c.ID " & _
            "FROM USR$PF_CHECK c " & _
            "LEFT JOIN USR$KINDTYPE kt ON kt.ID = c.USR$CARDPAY " & _
            "WHERE " & _
            " ( " & _
            "  IIF((SELECT COALESCE(kt.USR$NOFISCAL, 0) FROM USR$KINDTYPE kt WHERE kt.ID = <RUID XID = ""147134911"" DBID = ""478233273""/>) = 1, c.USR$SUMCREDIT, 0) > 0 " & _
            "  OR " & _
            "  IIF((SELECT COALESCE(kt.USR$NOFISCAL, 0) FROM USR$KINDTYPE kt WHERE kt.ID = <RUID XID = ""147082754"" DBID = ""478233273""/>) = 1, IIF(c.USR$CHECKKEY = <RUID XID = ""147004174"" DBID = ""818830148""/>, c.USR$SUMPAY, c.USR$SUMFACTPAY), 0) > 0 " & _
            "  OR " & _
            "  IIF((SELECT COALESCE(kt.USR$NOFISCAL, 0) FROM USR$KINDTYPE kt WHERE kt.ID = <RUID XID = ""147082755"" DBID = ""478233273""/>) = 1, c.USR$SUMADVANCE, 0) > 0 " & _
            "  OR " & _
            "  IIF((SELECT COALESCE(kt.USR$NOFISCAL, 0) FROM USR$KINDTYPE kt WHERE kt.ID = <RUID XID = ""147082756"" DBID = ""478233273""/>) = 1, c.USR$SUMCERTIFICATE, 0) > 0 " & _
            "  OR " & _
            "  IIF((SELECT COALESCE(kt.USR$NOFISCAL, 0) FROM USR$KINDTYPE kt WHERE kt.ID = <RUID XID = ""147011590"" DBID = ""1732947417""/>) = 1 AND COALESCE(kt.USR$ISPLCARD, 1) = 1, c.USR$SUMCARD, 0) > 0 " & _
            "  OR " & _
            "  IIF((SELECT COALESCE(kt.USR$NOFISCAL, 0) FROM USR$KINDTYPE kt WHERE kt.ID = <RUID XID = ""147057300"" DBID = ""1732947417""/>) = 1 AND COALESCE(kt.USR$ISPLCARD, 1) = 0, c.USR$SUMCARD, 0) > 0 " & _
            "  ) " & _
            "  AND " & _
            "  c.ID = :CheckID "
          ibsql.ParamByName("CheckID").AsInteger = gdcObject.ID
          ibsql.ExecQuery
        
          If Not ibsql.Eof Then
            isNonFiscal = True
          End If
          
          ' накопительная карточка (заполняется на всякий случай)
          ' (заполняется до печати чека. Если чек автоматически перепечатан  на ФР, мы должны иметь сохраненную карточку
          If gdcObject.VariableExists("CardKey") Then
            If gdcObject.Variables("CardKey") <> 0 Then
              gdcObject.Edit
              gdcObject.FieldByName("USR$DCARDKEY").AsInteger = gdcObject.Variables("CardKey")
              gdcObject.Post
            End If
          End If
        
          If pf_Options.IsNonFiscalMode Or isNonFiscal Then
            gdcObject.Edit
            gdcObject.FieldByName("USR$PRINT").AsInteger = 1
            gdcObject.Post
          Else
            gdcDetailObject.Last
            If Sender.OwnerForm.Variables("LineKey") > 0 Then
              ' если построчная печать - допечатать последнюю позицию
              If Not pf_options.PrintAfter Then
                If Not pf_Printer_PrintPosition(gdcDetailObject) Then
                  'Call Creator.DestroyAllObjects
                  Exit Function
                End If
                  
              End If
            End If
            Sender.OwnerForm.Variables("LineKey") = -1
        
            ' если построчная печать - распечатать оплаты, закрыть чек
            ' этот блок устарел
            If Not pf_options.PrintAfter Then
              If pf_Printer_PrintSummary(Sender) Then
                If pf_options.PrintFiscalCheck Then
                  ' пометить чек как распечатанный
                  gdcObject.Edit
                  gdcObject.FieldByName("USR$PRINT").AsInteger = 1
                  gdcObject.Post
                  
                  ' напечатать копию последнего чека
                  If pf_Options.PrintCopyCheck Then
                    Call ecr_GlobalPrinter.CopyLastCheck
                  End If
                End If
              Else
                ' ошибка при печати оплат
                'Call Creator.DestroyAllObjects
                Exit Function
              '!!!!!!!!!!!
              End If
            Else
              If pf_PrintAfter(Sender) Then
                If pf_options.PrintFiscalCheck Then
                  gdcObject.Edit
                  gdcObject.FieldByName("USR$PRINT").AsInteger = 1
                  gdcObject.Post
                  
                  If pf_Options.PrintCopyCheck Then
                    Call ecr_GlobalPrinter.CopyLastCheck
                  End If
                  
                  ''' печать купонов
                  pf_PrintCoupons(Sender)
                End If
              Else
                
                If pf_options.PrintFiscalCheck Then
                  'Call Creator.DestroyAllObjects
                  Exit Function
                End If
              '!!!!!!!!!!!!!!!!!
              End If
            End If
          End If
        
          ' сохранить итоговую информацию по чеку после успешной печати :
          ' накопительная скидка
          ' помесячная карта
          ' лимиты
          ' бонусы
          ' сертификаты
          ' время закрытия, номер смены, номер чека на ФР
          call pf_SaveCheckSummary(gdcObject, Tr, SumD, False)
          ' очистить темповую информацию
          call pfs_temptable_Delete(gdcObject)
          If Tr.InTransaction Then Tr.Commit
          If pf_options.CheckExp Then
           'откомментировать
           ' If gdcObject.FieldByName("USR$PRINT").AsInteger = 1 Then
              If pf_isSynchr(0) Then
                Call pd_ExportCheckQ(Date())
              End If
            'End If
          End If
        
          If (Sender.OwnerForm.Variables("CheckType") = _
              gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) Then
            Call ecr_PD.PutRest(- QuantC,  0)
          End If
        
          Sender.OwnerForm.GetComponent("usrg_Edit").Text = ""
          Sender.OwnerForm.Variables("CheckOpen") = 0
          Sender.OwnerForm.Variables("CheckType") = 0
        
        '=====5555========
        'убираем чекбокс грида, если он был отображен ,когда выбмрали оплату товаров по сертификату, в котором присутствовали товары, на которые сертификат не распространяется
          Dim gr,CheckList
          set gr = Sender.OwnerForm.GetComponent("usrg_gsIBGrid1")
          set CheckList = gr.CheckBox.CheckList
          CheckList.Clear
          gr.CheckBox.Visible = false
        '================
        
          pf_Options.FSeller = 0
          Call  pf_btnSell_Click(Sender)
        
        '====5555========
        ' Очищаем html экран
          call html_scrn_Clear()
        
        '================
          
          'Call Creator.DestroyAllObjects
          Set form = Nothing
        
        End Function
        
