        Option Explicit
        Function html_scrn_StartServer
          Dim Creator
          Set Creator = New TCreator
          dim folder : folder = pf_options.HtmlServer
          
          Dim FSO
          Set FSO = CreateObject("Scripting.FileSystemObject")
          if Not (FSO.FolderExists( folder )) or Not (FSO.FolderExists( folder & "\node_modules")) or Not (FSO.FileExists(folder & "\package.json"))  then exit function
          
          Dim command, ws : Set ws = CreateObject("wscript.Shell")
          ws.CurrentDirectory = folder
          command = "npm run complexdev -WindowStyle Hidden"
          ws.Run command, 0, False
        '  ws.Run command, 1, False
        '  if FSO.FileExists(folder & "\cmd\start.bat") then
        '    ws.CurrentDirectory = folder & "\cmd"
        '    command = "start.bat"
        '    ws.Run command, 1, True
        '  end if
          
          if FSO.FileExists(folder & "\cmd\createLink.vbs") then
            ws.CurrentDirectory = folder & "\cmd"
            command = "createLink.vbs"
            ws.Run command, 1, True
          end if
          
          if FSO.FileExists(folder & "\cmd\alttab.vbs") then
            ws.CurrentDirectory = folder & "\cmd"
            command = "alttab.vbs"
            ws.Run command, 1, True
          end if
        End Function
        
        
        
