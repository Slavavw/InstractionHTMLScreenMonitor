        Sub usrl_ComScanerOnChange_except(Tr)
          If Tr.InTransaction Then Tr.Rollback
        End Sub
        
        Function pf_ScanerChange_IsStringBarCodeCorrect(CodeType, StringBarCode, OpLogNum)
          pf_ScanerChange_IsStringBarCodeCorrect = true
        
          dim MessageText
          If CodeType = pf_codetype_BarCode And Len(StringBarCode) > 32 then
            MessageText = "Слишком длинный штрихкод!"
            pf_ScanerChange_IsStringBarCodeCorrect = false
          End If
        
          If CodeType = pf_codetype_Alias And Len(StringBarCode) > 32 then
            MessageText = "Слишком длинный артикул!"
            pf_ScanerChange_IsStringBarCodeCorrect = false
          End If
        
          If CodeType = pf_codetype_Price Then
            dim TempPriceVal, WasError
            WasError = false
            on error resume next
              TempPriceVal = CCur(StringBarCode)
              if Err.Number <> 0 then WasError = true
            on error goto 0
            If WasError then
              MessageText = "Неверная цена!"
              pf_ScanerChange_IsStringBarCodeCorrect = false
            End If
          End If
        
          If CodeType = pf_codetype_UniqueCode And Len(StringBarCode) > 60 then
            MessageText = "Слишком длинный код!"
            pf_ScanerChange_IsStringBarCodeCorrect = false
          End If
        
          If pf_ScanerChange_IsStringBarCodeCorrect = false then
            Call pf_ShowErrorMessage(MessageText)
            Call pf_ActionsList.AddToLog(OpLogNum, Null,Null, Null, MessageText & " " & StringBarCode, 1)
          End If
        End Function
        
        Function pf_ScanerChange_IsContralMarkRepeatedInCheck(HeadKey, Tr, gdcDetailObject)
          pf_ScanerChange_IsContralMarkRepeatedInCheck = false
          Dim Res
          Call gdcBaseManager.ExecSingleQueryResult( _
            "SELECT clmc.ID FROM USR$ETTN_CHECKLINE_MARKCODE clmc " & _
            "JOIN USR$PF_CHECKLINE chl ON chl.ID = clmc.USR$CHECKLINE " & _
            "WHERE chl.USR$MASTERKEY = :CHECK and clmc.USR$MARKCODE = :IDENTIFICATION ", _
            Array(HeadKey, pf_ContralMark.StringBarCode), Res, Tr)
          If ( Not IsEmpty(Res)) and (IsArray(Res))  Then
            if not isNull(Res(0, 0)) then
              Call pf_ShowErrorMessage("Данный товар уже выбран в чеке")
        
              Call gdcDetailObject.Locate("ID", Res(0,0),false)
              Dim Bookmark : Bookmark = gdcDetailObject.GetBookmark
              gdcDetailObject.GotoBookmark(Bookmark)
              pf_ContralMark.StringBarCode = ""
              pf_ScanerChange_IsContralMarkRepeatedInCheck = true
            end if
          End If
        End Function
        
