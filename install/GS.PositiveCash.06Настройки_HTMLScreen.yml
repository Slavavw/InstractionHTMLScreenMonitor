              '!!!!отключим возможность добавлять n - количество товаров с одинаковым СИ, вроде СИ тоже должно быть для товара каждого уникальное (возмможно) будет потом на партию товара у партии может быть одинаковое СИ ,но это вопрос
              ' If pf_ContralMark.IsUKZ(pf_ContralMark.mn_StringBarCode) then
              '777 13.06.25 Не проверяем уникальность кодов в старых чеках
              '          Call gdcBaseManager.ExecSingleQueryResult( _
