          Public Property Get ManagerGroupMask
            Dim Creator, gdc
            Set Creator = New TCreator
            Set gdc = Creator.GetObject(nil, "TgdcUserGroup", "")
            ManagerGroupMask = gdc.GetGroupMaskByID(gdcBaseManager.GetIDByRUIDString(pf_usergroup_manager))
            
            'Call Creator.DestroyAllObjects
          End Property
        
          Public Property Get CashierGroupMask
            Dim Creator, gdc
            Set Creator = New TCreator
            Set gdc = Creator.GetObject(nil, "TgdcUserGroup", "")
            CashierGroupMask = gdc.GetGroupMaskByID(gdcBaseManager.GetIDByRUIDString(pf_usergroup_cashier))
        
            'Call Creator.DestroyAllObjects
          End Property
        
          Public Property Get SeniorCashierGroupMask
            Dim Creator, gdc
            Set Creator = New TCreator
            Set gdc = Creator.GetObject(nil, "TgdcUserGroup", "")
            SeniorCashierGroupMask = gdc.GetGroupMaskByID(gdcBaseManager.GetIDByRUIDString(pf_usergroup_seniorcashier))
            
            'Call Creator.DestroyAllObjects
          End Property
        
          Public Property Get UserInGroupName
            If (IBLogin.InGroup and ManagerGroupMask)<> 0 then
              UserInGroupName = "Менеджер: "
            ElseIf (IBLogin.InGroup and SeniorCashierGroupMask) <> 0 then
              UserInGroupName = "Старший кассир: "
            ElseIf (IBLogin.InGroup and CashierGroupMask) <> 0 then
              UserInGroupName = "Кассир: "
            End If
          End Property
        
          Public Property Get Cashier
            Dim Creator
            Set Creator = New TCreator
            Dim sqlCashier, CName
            Set sqlCashier = Creator.GetObject(nil, "TIBSQL", "TVBpfOptions")
            sqlCashier.Transaction = gdcBaseManager.ReadTransaction
            sqlCashier.SQL.Text = _
              " SELECT ID, USR$NAME " & _
              " FROM USR$PF_CASHIER " & _
              " WHERE USR$USERKEY = :user "
            sqlCashier.ParamByName("user").AsInteger = IBLogin.UserKey
            sqlCashier.ExecQuery
        
            If not sqlCashier.Eof then
              FCashier = UserInGroupName & sqlCashier.FieldByName("usr$Name").AsString
            Else
              FCashier = -1
            End If
            Cashier = FCashier
            
            'Call Creator.DestroyAllObjects
          End Property
        
          Public Property Get CashCode
            If FCashCode > 0 then
              CashCode = FCashCode
            Else
              Dim Creator, ibsql_C
              Set Creator = New TCreator
              Set ibsql_C = Creator.getObject(null, "TIBSQL", "TVBpfOptions")
              ibsql_C.Transaction = gdcBaseManager.ReadTransaction
              ibsql_C.SQl.Text = _
                " select  " & _
                "   first(1)  " & _
                "   s.usr$cashcode as code, s.id   " & _
                " from   " & _
                "   usr$pf_cash s   " & _
                " where  " & _
                "   upper(s.usr$name) = upper(:comp)  " & _
                " order by  " & _
                "   s.id desc "
        
              ibsql_C.ParambyName("comp").AsString = UCASE(iblogin.ComputerName)
              ibsql_C.ExecQuery
              If not ibsql_C.Eof then
                FCashCode = ibsql_C.FieldByName("code").AsInteger
              Else
                FCashCode = -1
              End If
              CashCode = FCashCode
              
              'Call Creator.DestroyAllObjects
            End If
          End Property
          
          Private Function GetSQLSingleResult(SQLText)
            GetSQLSingleResult = ""
        
            FReadSQL.Close
            FReadSQL.SQL.Text = SQLText
