      DISPLAYSCRIPT: | 
        USRG_BTNLOADPICTUREONCLICK
        
      ENTEREDPARAMS: !!binary > 
        U0xQUlBSU1QGAAAAU0VOREVSBgAAAFNFTkRFUgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABGTlNU
        RkxQUg==
      SCRIPT: | 
        Option Explicit
        Sub usrg_btnLoadPictureOnClick(ByVal Sender)
        '*** Данный код необходим для вызова встроенного обработчика ***
        '*** В случае его удаления возможно нарушение работы системы ***
          Call   Inherited(Sender, "OnClick", Array(Sender))
        '*** конец кода поддержки встроенного обработчика            ***
          dim gid, SetToStr, i, Creator, OpenDialog
          set Creator = new TCreator
          set OpenDialog = Creator.GetObject(nil, "TOpenDialog", "")
          OpenDialog.DefaultExt = "bmp"
          OpenDialog.Filter = "Bitmaps (*.jpeg)|*.jpeg;*.jpg; (*.bmp, *png)|*.bmp;*.png (*.png)|*.png"
         ' (*.xls)|*.xlsx (*.xlsx)|*.xlsx;*.xls
        
          dim filename
          if OpenDialog.Execute then
             filename = OpenDialog.FileName
          end if
        
          if filename = "" then
            exit Sub
          end if
        
          dim FSO, inFile, ErrorLog, sLine, arr
          set FSO = CreateObject("Scripting.FileSystemObject")
        
          if filename = "" then
            call Exception.Raise("Exception", "Не выбран файл.")
          else
            if not FSO.FileExists(filename) then
              call Exception.Raise("Exception", "Файл "+filename+ " не существует")
            end if
          end if
        
        '  Dim gdcPicture
        '  set gdcPicture = Sender.OwnerForm.GetComponent("usrg_Picture")
        '  gdcPicture.Field.LoadFromFile(filename)
        
          Dim gdcObj
          set gdcObj = Sender.OwnerForm.GetComponent("dsgdcBase")
          Dim MStream
          Set MStream = Creator.GetObject(Null, "TMemoryStream", "")
          MStream.LoadFromFile(filename)
          gdcObj.DataSet.FieldByName("USR$PHOTO").LoadFromStream(MStream)
        End Sub
        
