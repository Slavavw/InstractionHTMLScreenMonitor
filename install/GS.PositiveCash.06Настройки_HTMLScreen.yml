      DISPLAYSCRIPT: | 
        PF_SCANERCHANGE
        USRL_COMSCANERONCHANGE_EXCEPT
        PF_SCANERCHANGE_ISSTRINGBARCODECORRECT
        PF_SCANERCHANGE_ISCONTRALMARKREPEATEDINCHECK
        
      ENTEREDPARAMS: !!binary > 
        U0xQUlBSU1QGAAAAU0VOREVSBgAAAFNFTkRFUgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABGTlNU
        UFJTVAYAAABJU1NDQU4GAAAASVNTQ0FOAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEZOU1RQUlNU
        CAAAAENPREVUWVBFCAAAAENPREVUWVBFAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEZOU1RGTFBS
      SCRIPT: | 
        Option Explicit
        '#include PF_FINDGOODBYCODE
        '#include CREATEPRICEVIEW
        '#include PF_SETGOODINFOLABEL
        '#include PF_FINDDISCOUNTCARDBYCODE
        '#include PF_BTNDISCOUNTCARD
        '#include PF_SHOWERRORMESSAGE
        '#include pf_InsertGoodPosition
        '#include pf_btnAvResult_Click
        Function pf_ScanerChange(Sender, IsScan, CodeType)
          pf_ScanerChange = False
        
          ' штрихкод: со сканера или из поля ввода
          Dim StringBarCode
          If IsScan Then
            StringBarCode = Sender.BarCode
            OpLogComment = vbCr & " Со сканера "
          Else
            StringBarCode = Trim(Sender.OwnerForm.GetComponent("usrg_Edit").Text)
            OpLogComment = ""
          End If
        
          '777 29.07.2025 Проверим, является ли введённая строка контрольной маркой, независимо от того, русская или английская раскладка
          If pf_ContralMark.DoesScanCodeBelongToContralMarkRusEngLayout(StringBarCode, True) Then
            CodeType = pf_codetype_ContralMark
            StringBarCode = pf_ContralMark.StringBarCode
          End If
        
          Dim OpLogNum, OpLogComment
          Select Case CodeType
            Case pf_codetype_BarCode
              OpLogNum = 22
            Case pf_codetype_Alias
              OpLogNum = 21
            Case pf_codetype_Price
              OpLogNum = 74
            Case pf_codetype_ContralMark
              OpLogNum = 22
              '777 18.06.25
              '      '777 09.06.25
              '       Call pf_ShowErrorMessage("Сначала отсканируйте штрихкод или добавьте товар иначе!")
              '       Call pf_ActionsList.AddToLog(OpLogNum, Null,Null, Null, "Сначала отсканируйте штрихкод или добавьте товар иначе!" & OpLogComment, 1)
              '       exit function
              '      '777 09.06.25
              Sender.OwnerForm.GetComponent("usrg_Edit").Text = pf_ContralMark.StringBarCode
            Case Else
              OpLogNum = 22
          End Select
        
          If Sender.OwnerForm.Variables("CheckOpen") <= 0 Then
            Call pf_ShowErrorMessage("Чек не откыт!")
            Call pf_ActionsList.AddToLog(OpLogNum, Null, Null, Null, "Чек не откыт" & OpLogComment, 1)
            Exit Function
          End If
        
          ' проверить текущий чек, не перепечатан ли он
          ' если да, то нужно при любом действии закрыть его
          '#include pf_CloseCurrentCheckIfReprinted
          If pf_CloseCurrentCheckIfReprinted(Sender.OwnerForm) Then Exit Function
        
          Dim GoodInfo, Tr, gdcObject, gdcDetailObject
          Dim frm, n, LineKey, MasterKey, PriceKey, CodeDepot
          Dim NoError
          Set frm = Sender.OwnerForm
        
          MasterKey = - 1
        
          NoError = True
        
          Set gdcObject = Sender.OwnerForm.gdcObject
          Set gdcDetailObject = Sender.OwnerForm.GetComponent("usrg_gdcCheckLine")
          Set Tr = Sender.OwnerForm.GetComponent("usrg_Transa")
          If Not Tr.InTransaction Then Tr.StartTransaction
        
          If gdcDetailObject.Active Then gdcDetailObject.Last
        
          'Проверим правильность строки в соответствии с типом кода
          If Not pf_ScanerChange_IsStringBarCodeCorrect(CodeType, StringBarCode, OpLogNum) Then
            Exit Function
          End If
        
          If Sender.OwnerForm.Variables("IsPriceView") Then
            Call CreatePriceView(Sender, True, StringBarCode, CodeType)
            Exit Function
          End If
        
          except usrl_ComScanerOnChange_except(Tr)
        
          gdcDetailObject.Variables("DontCalcDiscount") = ( _
            Sender.OwnerForm.Variables("CheckType") = gdcBaseManager.GetIDBYRUIDString(pf_checktype_return))
          Dim IsReturn
          IsReturn = 0
          If (Sender.OwnerForm.Variables("CheckType") = _
              gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) Then
            IsReturn = 1
          End If
        
          Dim qPrice, Creator, isDiscountCard
          LineKey = - 1
          Dim o
          Set o = Sender.OwnerForm
        
          If Sender.OwnerForm.Variables("isDiscCardMode") Then
            '    Sender.OwnerForm.Variables("isDiscCardMode") = false
            isDiscountCard = pf_FindDiscountCardByCode(StringBarCode, Tr)
            If isDiscountCard Then
              gdcDetailObject.First
              Call pf_btnDiscountCard(Sender)
              Exit Function
            Else
              Call pf_ShowErrorMessage("Карта не найдена!")
              Call pf_ActionsList.AddToLog(OpLogNum, gdcObject.ID, Null, Null, "Карта не найдена: код " & StringBarCode, 1)
              Exit Function
            End If
          End If
          ' Информация о товаре по штрихкоду \ алиасу \ прайсу
          Set GoodInfo = pf_FindGoodByCode(StringBarCode, CodeType, Tr, IsReturn, False, False)
        
          ' найден товар и прайс (или возврат, когда прайса может не быть )
          If GoodInfo.GoodKey > 0 And (GoodInfo.PriceKey > 0 Or ((IsReturn > 0) And gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").AsInteger > 0)) Then
            Dim HeadKey
            If IsReturn > 0 Then
              HeadKey = Sender.OwnerForm.Variables("CheckKey")
            Else
              HeadKey = gdcObject.Id
            End If
        
            ' если состояние чека - возврат,  и известен номер чека, мы можем контролировать
            ' кол-во по нему (чтоб не вернули больше, чем было в чеке)
            If (IsReturn > 0) And (gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").AsInteger > 0) Then
              Set Creator = New TCreator
              Set qPrice = Creator.GetObject(nil, "TIBSQL", "pfScanerChange")
              qPrice.Transaction = Tr
        
              ' ищем позицию в чеке продажи
              ' если известен прайс, ищем по нему
              ' иначе (если прайс уже не существует) - ищем по ИД товара
              If GoodInfo.ConcernedLineKey <= 0 Then
                If CodeType = pf_codetype_ContralMark Or GoodInfo.ContralMark <> "" Then
                  qPrice.SQL.Text = _
                    "SELECT " & vbCrLf & _
                    "    cl.ID, " & vbCrLf & _
                    "    parttrc.PARTQUANTITY USR$QUANTITY, " & vbCrLf & _
                    "    cl.USR$NUMBER, " & vbCrLf & _
                    "    cl.USR$PRICEINT, " & vbCrLf & _
                    "    cl.USR$CODEDEPOT, " & vbCrLf & _
                    "    cl.USR$ISBONUS, " & vbCrLf & _
                    "    parttrc.USR$PRICESALE, " & vbCrLf & _
                    "    parttrc.PARTSUMDISCOUNT USR$SUMDISCOUNT, " & vbCrLf & _
                    "    parttrc.PARTSUMBONUS as USR$SUMBONUS, " & vbCrLf & _
                    "    parttrc.IDENTIFICATION " & vbCrLf & _
                    " FROM USR$PF_CHECKLINE cl " & vbCrLf & _
                    " JOIN USR$ETTN_CHECKLINE_MARKCODE clmc on clmc.USR$CHECKLINE = cl.ID " & vbCrLf & _
                    " LEFT JOIN USR$PRF_ETTN_PARTCHECKLINE(cl.ID) parttrc on 1 = 1 AND trim(clmc.USR$MARKCODE) = trim(parttrc.IDENTIFICATION) " & vbCrLf & _
                    " WHERE " & vbCrLf & _
                    "    cl.USR$MASTERKEY = :MMasterKey " & vbCrLf & _
                    "    AND " & vbCrLf & _
                    "    cl.USR$CONCCHECKLINEKEY IS NULL " & vbCrLf & _
                    "    AND trim(clmc.USR$MARKCODE) = :IDENTIFICATION "
        
                  qPrice.ParamByName("IDENTIFICATION").AsString = GoodInfo.ContralMark
                Else
                  If GoodInfo.PriceKey > 0 Then
                    qPrice.SQL.Text = _
                      "SELECT " & vbCrLf & _
                      "      ID, " & vbCrLf & _
                      "      USR$QUANTITY, " & vbCrLf & _
                      "      USR$NUMBER, " & vbCrLf & _
                      "      USR$PRICEINT, " & vbCrLf & _
                      "      USR$CODEDEPOT, " & vbCrLf & _
                      "      USR$PRICESALE, " & vbCrLf & _
                      "      USR$SUMDISCOUNT, " & vbCrLf & _
                      "      USR$SUMBONUS, " & vbCrLf & _
                      "      USR$ISBONUS  " & vbCrLf & _
                      "    FROM USR$PF_CHECKLINE  " & vbCrLf & _
                      "    WHERE USR$MASTERKEY = :MMasterKey  " & vbCrLf & _
                      "        AND USR$CONCCHECKLINEKEY IS NULL AND USR$PRICEINT = :good  "
                    qPrice.ParamByName("good").AsInteger = GoodInfo.PriceKey
                  Else
                    qPrice.SQL.Text = _
                      "SELECT ID, USR$QUANTITY, USR$NUMBER, USR$PRICEINT, USR$CODEDEPOT, USR$PRICESALE, USR$SUMDISCOUNT, USR$SUMBONUS, USR$ISBONUS " & vbCrLf & _
                      "FROM USR$PF_CHECKLINE " & vbCrLf & _
                      "WHERE USR$MASTERKEY = :MMasterKey " & vbCrLf & _
                      " AND USR$CONCCHECKLINEKEY IS NULL AND USR$GOODKEY = :good "
                    qPrice.ParamByName("good").AsInteger = GoodInfo.GoodKey
                  End If
                End If
                qPrice.ParamByName("MMasterKey").AsInteger = HeadKey
                qPrice.ExecQuery
              End If
        
              ' нашли позицию продажи, по которой надо делать возврат
              If (( Not qPrice.EoF) Or (GoodInfo.ConcernedLineKey > 0)) Then
                ' находим сумму данного товара по чеку продажи и чеку возврата,
                ' и ее отменяем
                If GoodInfo.ConcernedLineKey <= 0 Then
                  GoodInfo.ConcernedLineKey = qPrice.FieldByName("ID").AsInteger
                  GoodInfo.PriceSale = qPrice.FieldByName("USR$PRICESALE").AsCurrency
                End If
        
                qPrice.Close
                If CodeType = pf_codetype_ContralMark Or GoodInfo.ContralMark <> "" Then
                  qPrice.SQL.Text = _
                    "SELECT " & vbCrLf & _
                    "    cl.USR$GOODKEY, " & vbCrLf & _
                    "    cl.USR$NAME AS NAME, " & vbCrLf & _
                    "    cl.USR$ALIAS AS USR$CODE1, " & vbCrLf & _
                    "    cl.USR$BARCODE AS BARCODE,  " & vbCrLf & _
                    "    parttrc.PARTQUANTITY AS Q, " & vbCrLf & _
                    "    parttrc.PARTSUMWITHDISCOUNT/parttrc.PARTQUANTITY AS SD, " & vbCrLf & _
                    "    parttrc.USR$PRICESALE As USR$PRICESALE, " & vbCrLf & _
                    "    cl.USR$ISDISC/cl.USR$QUANTITY as USR$ISDISC, " & vbCrLf & _
                    "    parttrc.USR$PRICE USR$PRICE, " & vbCrLf & _
                    "    cl.USR$SELLERKEY, " & vbCrLf & _
                    "    parttrc.PARTSUMDISCOUNT As USR$SUMDISCOUNT, " & vbCrLf & _
                    "    parttrc.PARTSUMBONUS As USR$SUMBONUS, " & vbCrLf & _
                    "    cl.USR$ISBONUS " & vbCrLf & _
                    "FROM USR$PF_CHECKLINE cl   " & vbCrLf & _
                    "JOIN USR$PF_CHECK c ON c.ID = cl.USR$MASTERKEY AND c.USR$CHECKKEY IN ( " & vbCrLf & _
                    CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_sell)) & ", " & vbCrLf & _
                    CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_pending)) & ", " & vbCrLf & _
                    CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) & ") " & vbCrLf & _
                    "JOIN USR$ETTN_CHECKLINE_MARKCODE clmc on clmc.USR$CHECKLINE = cl.ID  " & vbCrLf & _
                    "LEFT JOIN USR$PRF_ETTN_PARTCHECKLINE(cl.ID) parttrc on 1 = 1 and trim(parttrc.IDENTIFICATION) = :IDENTIFICATION " & vbCrLf & _
                    "WHERE cl.USR$GOODKEY = :good  AND cl.USR$PRICESALE = :PS   " & vbCrLf & _
                    "  AND   ((cl.USR$MASTERKEY = :MMasterKey2) OR(c.USR$CONCERNEDCHECKKEY = :MMasterKey2))  " & vbCrLf & _
                    "  AND trim(clmc.USR$MARKCODE) = :IDENTIFICATION  "
        
                  qPrice.ParamByName("IDENTIFICATION").AsString = GoodInfo.ContralMark
                  qPrice.ParamByName("good").AsInteger = GoodInfo.GoodKey
                Else
                  qPrice.SQL.Text = _
                    "SELECT " & vbCrLf & _
                    "    cl.USR$GOODKEY,    " & vbCrLf & _
                    "    cl.USR$NAME AS NAME,    " & vbCrLf & _
                    "    cl.USR$ALIAS AS USR$CODE1,    " & vbCrLf & _
                    "    cl.USR$BARCODE AS BARCODE,   " & vbCrLf & _
                    "    cl.USR$PRICESALE,   " & vbCrLf & _
                    "    cl.USR$PRICE,   " & vbCrLf & _
                    "    cl.USR$ISDISC,    " & vbCrLf & _
                    "    cl.USR$SELLERKEY,    " & vbCrLf & _
                    "    cl.USR$ISBONUS,   " & vbCrLf & _
                    "    Sum( " & vbCrLf & _
                    "        CASE c.USR$CHECKKEY  " & vbCrLf & _
                    "        WHEN " & CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) & " THEN " & vbCrLf & _
                    "            -parttrc.PARTQUANTITY " & vbCrLf & _
                    "        ELSE " & vbCrLf & _
                    "             iif( cl.USR$MASTERKEY = :MMasterKey2, iif (parttrc.IDENTIFICATION ='',parttrc.PARTQUANTITY,0),parttrc.PARTQUANTITY) " & vbCrLf & _
                    "    END) AS Q,  " & vbCrLf & _
                    "    Sum( " & vbCrLf & _
                    "        CASE c.USR$CHECKKEY  " & vbCrLf & _
                    "        WHEN " & CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) & " THEN " & vbCrLf & _
                    "            -parttrc.PARTSUMWITHDISCOUNT " & vbCrLf & _
                    "        ELSE " & vbCrLf & _
                    "            iif( cl.USR$MASTERKEY = :MMasterKey2, iif (parttrc.IDENTIFICATION ='',parttrc.PARTSUMWITHDISCOUNT ,0),parttrc.PARTSUMWITHDISCOUNT ) " & vbCrLf & _
                    "    END) AS SD, " & vbCrLf & _
                    "    Sum( " & vbCrLf & _
                    "        CASE c.USR$CHECKKEY  " & vbCrLf & _
                    "        WHEN " & CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) & " THEN " & vbCrLf & _
                    "            -parttrc.PARTSUMDISCOUNT " & vbCrLf & _
                    "        ELSE " & vbCrLf & _
                    "            iif( cl.USR$MASTERKEY = :MMasterKey2, iif (parttrc.IDENTIFICATION ='',parttrc.PARTSUMDISCOUNT ,0),parttrc.PARTSUMDISCOUNT ) " & vbCrLf & _
                    "    END) AS USR$SUMDISCOUNT, " & vbCrLf & _
                    "    Sum( " & vbCrLf & _
                    "        CASE c.USR$CHECKKEY  " & vbCrLf & _
                    "        WHEN " & CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) & " THEN " & vbCrLf & _
                    "            -parttrc.PARTSUMBONUS " & vbCrLf & _
                    "        ELSE " & vbCrLf & _
                    "            iif( cl.USR$MASTERKEY = :MMasterKey2, iif (parttrc.IDENTIFICATION ='',parttrc.PARTSUMBONUS  ,0),parttrc.PARTSUMBONUS  ) " & vbCrLf & _
                    "    END) AS USR$SUMBONUS, " & vbCrLf & _
                    "    Sum( " & vbCrLf & _
                    "        CASE c.USR$CHECKKEY  " & vbCrLf & _
                    "        WHEN " & CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) & " THEN " & vbCrLf & _
                    "            -parttrc.PARTSUMDISCOUNT " & vbCrLf & _
                    "        ELSE " & vbCrLf & _
                    "            iif( cl.USR$MASTERKEY = :MMasterKey2, iif (parttrc.IDENTIFICATION ='',parttrc.PARTSUMDISCOUNT  ,0),parttrc.PARTSUMDISCOUNT  ) " & vbCrLf & _
                    "    END) AS USR$SUMDISCOUNT " & vbCrLf & _
                    "FROM USR$PF_CHECKLINE cl    " & vbCrLf & _
                    "JOIN USR$PF_CHECK c ON c.ID = cl.USR$MASTERKEY AND c.USR$CHECKKEY IN ( " & vbCrLf & _
                    CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_sell)) & ", " & vbCrLf & _
                    CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_pending)) & ", " & vbCrLf & _
                    CStr(gdcBaseManager.GetIDBYRUIDString(pf_checktype_return)) & ") " & vbCrLf & _
                    "LEFT JOIN USR$PRF_ETTN_PARTCHECKLINE(cl.ID) parttrc on 1 = 1  " & vbCrLf & _
                    "WHERE  "
                  If GoodInfo.PriceKey > 0 Then
                    qPrice.SQL.Text = _
                      qPrice.SQL.Text & vbCrLf & _
                      " cl.USR$PRICEINT = " & GoodInfo.PriceKey
                  Else
                    qPrice.SQL.Text = _
                      qPrice.SQL.Text & vbCrLf & _
                      " cl.USR$GOODKEY = " & GoodInfo.GoodKey
                  End If
                  qPrice.SQL.Text = _
                    qPrice.SQL.Text & vbCrLf & _
                    " AND cl.USR$PRICESALE = :PS    " & vbCrLf & _
                    " AND (  " & vbCrLf & _
                    "    (cl.USR$MASTERKEY = :MMasterKey1) or  " & vbCrLf & _
                    "    ((cl.USR$MASTERKEY = :MMasterKey2) OR (c.USR$CONCERNEDCHECKKEY = :MMasterKey2))  " & vbCrLf & _
                    " )  " & vbCrLf & _
                    " GROUP BY 1, 2, 3, 4, 5, 6, 7, 8, 9 " & vbCrLf & _
                    " HAVING SUM(cl.USR$QUANTITY) <> 0   "
                  qPrice.ParamByName("MMasterKey1").AsInteger = gdcObject.Id
                End If
                qPrice.ParamByName("MMasterKey2").AsInteger = HeadKey
                qPrice.ParamByName("PS").AsCurrency = GoodInfo.PriceSale
                qPrice.ExecQuery
                If ( Not qPrice.EoF) Then
                  ' если есть какое-то кол-во данного товара в чеке продажи (то, что еще не вернули), вернем все это кол-во
                  '
                  If qPrice.FieldByName("Q").AsCurrency > 0 Then
                    pf_Options.FSeller = qPrice.FieldByName("USR$SELLERKEY").AsCurrency
                    If (IsReturn > 0) Then
                      GoodInfo.Price = qPrice.FieldByName("USR$PRICE").AsCurrency
                    Else
                      GoodInfo.Price = qPrice.FieldByName("USR$PRICESALE").AsCurrency
                    End If
                    GoodInfo.PriceSale = qPrice.FieldByName("USR$PRICESALE").AsCurrency
                    GoodInfo.Quantity = - qPrice.FieldByName("Q").AsCurrency
                    GoodInfo.IsDisc = qPrice.FieldByName("USR$ISDISC").AsInteger
                    GoodInfo.SumDiscount = qPrice.FieldByName("USR$SUMDISCOUNT").AsCurrency
                    If GoodInfo.PriceKey <= 0 Then
                      '   GoodInfo.PriceKey = qPrice.FieldByName("USR$PRICEINT").AsInteger
                      GoodInfo.PriceKey = 111111
                    End If
        
                    If gdcObject.FieldByName("USR$BONUSCARDKEY").AsInteger > 0 Then
                      GoodInfo.IsBonus = (qPrice.FieldByName("USR$ISBONUS").AsInteger = 1)
                      If GoodInfo.IsBonus Then
                        GoodInfo.SumBonus = qPrice.FieldByName("USR$SUMBONUS").AsCurrency
                        '                If pf_Options.UseBonusKindType Then
                        '                  GoodInfo.SumDiscount = qPrice.FieldByName("USR$SUMBONUS").AsCurrency
                        '                Else
                        '                  GoodInfo.SumDiscount = qPrice.FieldByName("USR$SUMDISCOUNT").AsCurrency
                        '                End If
                      End If
                    End If
                    If pf_ScanerChange_IsContralMarkRepeatedInCheck(gdcObject.Id, Tr, gdcDetailObject) Then
                      Exit Function
                    End If
                    LineKey = pf_InsertGoodPosition(GoodInfo, gdcObject, gdcDetailObject, Tr, IsScan, - qPrice.FieldByName("SD").AsCurrency)
                    Call pf_BonusCard.Init(gdcObject.FieldByName("USR$BONUSCARDKEY").AsInteger, BonusCardByID)
        
                    Dim qSumCheck
                    Set qSumCheck = Creator.GetObject(Null, "TIBSQL", "pfScanerChange")
                    qSumCheck.Transaction = gdcBaseManager.ReadTransaction
                    qSumCheck.SQL.Text = _
                      "SELECT " & vbCrLf & _
                      "  SUM(USR$SUMWITHDISCOUNT) AS SumCheck " & vbCrLf & _
                      "FROM USR$PF_CHECKLINE cl " & vbCrLf & _
                      "JOIN GD_GOOD good ON good.ID = cl.USR$GOODKEY " & vbCrLf & _
                      "WHERE " & vbCrLf & _
                      "  USR$MASTERKEY = :mkey AND cl.ID = :CheckLineKey "
                    If pf_BonusCard.IsDiscOff Then
                      qSumCheck.SQL.Text = _
                        qSumCheck.SQL.Text & _
                        "  AND " & vbCrLf & _
                        "  (cl.USR$SUMWITHDISCOUNT = cl.USR$SUM AND cl.USR$ISBONUS = 1) "
                    End If
                    If pf_BonusCard.IsGoodOff Then
                      qSumCheck.SQL.Text = _
                        qSumCheck.SQL.Text & _
                        "  AND " & vbCrLf & _
                        "  NOT EXISTS( " & vbCrLf & _
                        "    SELECT * " & vbCrLf & _
                        "    FROM " & vbCrLf & _
                        "      USR$PF_BONUSCARD card " & vbCrLf & _
                        "      JOIN USR$PF_BONUSCARD_TYPES bt ON bt.ID = card.USR$BONUSCARDTYPEKEY " & vbCrLf & _
                        "      JOIN USR$PF_BONUSCARD_TYPES_INFO bti ON bti.USR$BONUSCARDTYPEKEY = bt.ID " & vbCrLf & _
                        "    WHERE " & vbCrLf & _
                        "      card.ID = " & pf_BonusCard.ID & " AND (good.ID = bti.USR$GOODKEY OR good.GROUPKEY = bti.USR$GROUPKEY)) "
                    End If
                    qSumCheck.ParamByName("mkey").AsInteger = gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").AsInteger
                    qSumCheck.ParamByName("CheckLineKey").AsInteger = GoodInfo.ConcernedLineKey
                    qSumCheck.ExecQuery
        
                    Dim ibsql
                    Set ibsql = Creator.GetObject(Null, "TIBSQL", "pfScanerChange")
                    ibsql.Transaction = gdcBaseManager.ReadTransaction
                    ibsql.SQL.Text = _
                      "SELECT " & vbCrLf & _
                      "  bcp.USR$PERCENT/100 AS PERCENT " & vbCrLf & _
                      "FROM USR$BONUSCARD_CALC_PERCENT  bcp " & vbCrLf & _
                      "WHERE bcp.USR$MIN_SUM <= :Summa " & vbCrLf & _
                      "ORDER BY bcp.USR$MIN_SUM DESC " & vbCrLf & _
                      "ROWS 1 "
                    ibsql.ParamByName("Summa").AsCurrency = qSumCheck.FieldByName("SumCheck").AsCurrency
                    ibsql.ExecQuery
        
                    gdcObject.Edit
                    gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").AsInteger = _
                      Sender.OwnerForm.Variables("CheckKey")
        
                    If gdcObject.FieldByName("USR$BONUSCARDKEY").AsInteger > 0 Then
                      gdcObject.FieldByName("USR$SUMBONUS").AsCurrency = _
                        Abs(gdcObject.FieldByName("USR$SUMBONUS").AsCurrency) + _
                        Abs(GoodInfo.SumBonus)
                      gdcObject.FieldByName("USR$ACCUMSUMBONUS").AsCurrency = _
                         - 1 * gs.MulDiv(qSumCheck.FieldByName("SumCheck").AsCurrency, ibsql.FieldByName("PERCENT").AsCurrency, 1, 1, pf_Options.PrecisionRound)
                    End If
                    gdcObject.Post
                  Else
                    Call pf_ShowErrorMessage("Суммарное количество товара по чеку равно нулю!")
                    Call pf_ActionsList.AddToLog(OpLogNum, gdcObject.ID, Null, Null, _
                      "Суммарное количество товара по чеку равно нулю. Код " & StringBarCode & OpLogComment, 1)
                    NoError = False
                  End If
                Else
                  Call pf_ShowErrorMessage("Позиция не найдена!")
                  Call pf_ActionsList.AddToLog(OpLogNum, gdcObject.ID, Null, Null, _
                    "Позиция продажи не найдена. Код " & StringBarCode & OpLogComment, 1)
                  NoError = False
                End If
              Else
                ' не нашли позицию продажи, по которой надо делать возврат, в чеке продажи
                Call pf_ShowErrorMessage("Позиция не найдена!")
                Call pf_ActionsList.AddToLog(OpLogNum, gdcObject.ID, Null, Null, _
                  "Позиция продажи не найдена. Код " & StringBarCode & OpLogComment, 1)
                NoError = False
              End If
        
            ElseIf IsReturn And gdcObject.FieldByName("USR$CONCERNEDCHECKKEY").AsInteger = 0 Then
              ' возврат, но неизвестен номер чека, по которому возвращаем
              GoodInfo.Quantity = - 1
              If pf_ScanerChange_IsContralMarkRepeatedInCheck(gdcObject.Id, Tr, gdcDetailObject) Then
                Exit Function
              End If
              LineKey = pf_InsertGoodPosition(GoodInfo, gdcObject, gdcDetailObject, Tr, IsScan, Null)
            Else
              ' состояние чека - продажа
              ' вставляем новую позицию
              If pf_options.ControlRemains And GoodInfo.PriceKey > 0 And (CodeType <> pf_codetype_Sum) _
                   And InStr(UCase(GoodInfo.GoodName), UCase("Сертификат")) = 0 _
                   And InStr(UCase(GoodInfo.GoodName), UCase("Деньги")) = 0 Then
                Set Creator = New TCreator
                Set qPrice = Creator.GetObject(nil, "TIBSQL", "pfScanerChange")
                qPrice.Transaction = Tr
                qPrice.SQL.Text = _
                  "SELECT pr.USR$QUANTITY AS SumQ " & vbCrLf & _
                  "FROM USR$PF_PRICELIST pr " & vbCrLf & _
                  "WHERE pr.ID = :PriceKey "
                qPrice.ParamByName("PriceKey").AsVariant = GoodInfo.PriceKey
                qPrice.ExecQuery
        
                Dim QuantAll : QuantAll = qPrice.FieldByName("SumQ").AsCurrency
                If QuantAll <= 0 Then
                  Call pf_ShowErrorMessage("По товару нет остатков! ")
                  Sender.OwnerForm.GetComponent("usrg_Edit").Text = ""
                  Sender.OwnerForm.GetComponent("usrg_Edit").SetFocus
                  Call pf_ActionsList.AddToLog(OpLogNum, gdcObject.ID, Null, Null, _
                    "По товару нет остатков. " & "Товар " & GoodInfo.GoodName & " " & GoodInfo.Barcode & OpLogComment, 1)
                  Exit Function
                ElseIf GoodInfo.Quantity > QuantAll Then
                  If Application.MessageBox("Выбрано превышающее количество товара. Всего имеется: " + _
                      CStr(QuantAll) & ". Выбрать доступное количество?", "Внимание", vbYesNo + vbInformation + vbSystemModal) = vbYes Then
                    GoodInfo.Quantity = QuantAll
                    Call pf_ActionsList.AddToLog(OpLogNum, gdcObject.ID, Null, Null, _
                      "Выбрано превышающее количество товара. Всего имеется: " & vbCrLf & _
                      CStr(QuantAll) & ". Товар " & GoodInfo.GoodName & " " & GoodInfo.Barcode & OpLogComment & "Кол-во " & GoodInfo.Quantity & " изменено на " & QuantAll, 0)
                  Else
                    Sender.OwnerForm.GetComponent("usrg_Edit").Text = ""
                    Sender.OwnerForm.GetComponent("usrg_Edit").SetFocus
                    Call pf_ActionsList.AddToLog(OpLogNum, gdcObject.ID, Null, Null, _
                      "Выбрано превышающее количество товара. Всего имеется: " & vbCrLf & _
                      CStr(QuantAll) & ". Товар " & GoodInfo.GoodName & " " & GoodInfo.Barcode & OpLogComment, 1)
                    Exit Function
                  End If
                End If
              End If
              '=====55555=======
              ' проверим не перевыбран повторно прослеживаемый товар, который уже eсть в чеке
