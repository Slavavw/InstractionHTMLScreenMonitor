      SCRIPT: | 
        Option Explicit
        Function html_initScreeen(ByVal Sender)
          const adSaveCreateOverWrite = 2
          Dim Creator, objShell, objFolder, Path
          set Creator = new TCreator
          Dim FSO
          Set FSO = CreateObject("Scripting.FileSystemObject")
          Set objShell = CreateObject("Shell.Application")
        
          Dim usrg_chkGitLoad
          set usrg_chkGitLoad = Sender.GetComponent("usrg_chkGitLoad")
          
          path = GlobalStorage.ReadString("Option\HTMLServer", "HtmlServer", "")
          if path = "" then
             if usrg_chkGitLoad.Checked then
                If ecr_MessageBox("Создать папку по умолчанию, куда будет загружен WEB монитор?" & VbCrlf &_
                   "Папка по умолчанию куда будет установлено: " & System.GedeminPath & "HTMLScreen_Cash", vbYesNo) = vbYes then
                   path = System.GedeminPath
                else
                    Set objFolder = objShell.BrowseForFolder(0, "Выберите папку в которую будет установлена программа", 528)
                    if objFolder Is Nothing Then exit function
                    path = objFolder.Self.Path
                end if
             else
                call ecr_MessageBox("Вы не выбрали каталог, а который должны распаковать архив модуля HTML_Screen" & VbCrlf &_
                   "Выберите каталог", vbOk)
                Set objFolder = objShell.BrowseForFolder(0, "Выберите папку в которую распаковали модуль", 528)
                    if objFolder Is Nothing Then exit function
                    path = objFolder.Self.Path
             end if
             if right(path,1) = "\" then path = left(path,len(path)-1)
             Dim usrg_edHtmlServer
             set usrg_edHtmlServer = Sender.GetComponent("usrg_edHtmlServer")
             usrg_edHtmlServer.Text = path
             call GlobalStorage.WriteString("Option\HTMLServer", "HtmlServer", path)
          end if
          pf_options.IsSumPosition = true
        
          Dim folder : folder = pf_options.HtmlServer
        
          Dim command, ws : Set ws = CreateObject("wscript.Shell")
          if usrg_chkGitLoad.Checked then
             ws.CurrentDirectory = path
         '    command = "git init"
         '    ws.Run command, 1, False
             if Not (FSO.FolderExists( folder )) or Not FSO.FileExists(folder & "\package.json") or Not FSO.FolderExists(folder & "\node_modules")  then
                command = "git clone git@github.com:Slavavw/HTMLScreen_Cash.git"
                ws.Run command, 1, False
                
                folder = folder & "\HTMLScreen_Cash"
                
             end if
             dim count : count = 10000
             dim i : i = 0
             while Not FSO.FolderExists(path)
               i = i + 1
             wend
             i = 0
             while Not FSO.FileExists(folder & "\package.json")
               i = i + 1
             wend
          end if
        
          if Not FSO.FileExists(folder & "\package.json") then
             call ecr_MessageBox("Не полный комплект модуля в папке " & folder & VbCrlf &_
                   "Отсутствует package.json", vbOk)
             exit function
          end if
          if Not FSO.FolderExists(folder & "\node_modules") then
            command = "npm install"
            ws.CurrentDirectory = folder
            ws.Run command, 1, True
          end if
          
          ' в папке cmd храним команды батник старт, а также vbs скриптты для создания ярлыка и команды переключения экрана alt+tab
          if Not FSO.FolderExists(folder & "\cmd") then
             FSO.CreateFolder(folder & "\cmd")
          end if
        
          if Not FSO.FolderExists(folder & "\images") then
             FSO.CreateFolder(folder & "\images")
          end if
        
          if Not FSO.FolderExists(folder & "\images\background") then
             FSO.CreateFolder(folder & "\images\background")
          end if
          
          Err.Clear
          on error resume next
          if FSO.FolderExists(folder & "\images\reklama") then
            call FSO.DeleteFolder(folder & "\images\reklama", true)
          end if
          
        '  if Not FSO.FolderExists(folder & "\images\reklama") then
             FSO.CreateFolder(folder & "\images\reklama")
         ' end if
         
         if Err.Description <> "" then
             call Application.MessageBox(err.description, "Внимание", vbOkOnly + vbInformation + vbSystemModal)
           end if
           on error goto 0
           Err.Clear
        
          if Not FSO.FolderExists(folder & "\source") then
             FSO.CreateFolder(folder & "\source")
          end if
        
          if Not FSO.FolderExists(folder & "\source\pre_order") then
             FSO.CreateFolder(folder & "\source\pre_order")
          end if
        
          Dim MStream
          Set MStream = Creator.GetObject(Null, "TMemoryStream", "")
        
          Dim ibsql
          set ibsql = Creator.GetObject(NULL, "TIBSQL", "")
          ibsql.Transaction = gdcBaseManager.ReadTransaction
        
          ibsql.SQL.Text = "select cmp.usr$photo as PHOTO from gd_ourcompany z " & vbCrLf & _
            "JOIN gd_contact c ON c.id = z.companykey " & vbCrLf & _
            "JOIN gd_company cmp on cmp.contactkey = z.companykey "
          ibsql.ExecQuery
          if not ibsql.Eof then
            if Not IsNull(ibsql.FieldByName("photo").AsVariant) then
              ibsql.FieldByName("PHOTO").SaveToStream(MStream)
              MStream.SaveToFile(folder & "\images\background\background.jpg")
              MStream.Clear
            else
              if FSO.FileExists(folder & "\images\background\background.jpg") then FSO.DeleteFile(folder & "\images\background\background.jpg")
            end if
          end if
        
         'получить какие колонки видимые из настроек
          Dim Grid : Set Grid = Sender.GetComponent("usrg_grdColumn")
          Dim dctClmnVisible
          set dctClmnVisible = CreateObject("Scripting.Dictionary")
          
          Dim k
          for k = 0 to Grid.Columns.Count - 1
            dctClmnVisible.Add UCase(Grid.Columns.Items(k).FieldName), Not(Grid.Columns.Items(k).Visible)
          next
        
          ibsql.Close
          ibsql.SQL.Text = _
            "select first 1 " & vbCrLf & _
            "  0.001 as usr$quantity, " & vbCrLf & _
            "  1 as USR$SUMDISCOUNT, " & vbCrLf & _
            "  1 as USR$SUMWITHDISCOUNT, " & vbCrLf & _
            "  gg.name as usr$name, " & vbCrLf & _
            "  g.name as GoodName, " & vbCrLf & _
            "  gg.name as GrName, " & vbCrLf & _
            "  gg.id as grid, " & vbCrLf & _
            "  pl.usr$price as FullCost, " & vbCrLf & _
            "  '' as outputStr, " & vbCrLf & _
            "  g.USR$PHOTO PHOTO, " & vbCrLf & _
            "  R.XID || '_' || R.DBID AS RUID, " & vbCrLf & _
            "  r_ml.XID || '_' || r_ml.DBID AS RUID_ML " & vbCrLf & _
            "from " & vbCrLf & _
            "usr$pf_pricelist pl " & vbCrLf & _
            "join gd_good g on g.id = pl.usr$goodkey " & vbCrLf & _
            "join GD_GOODGROUP gg on gg.id = g.groupkey " & vbCrLf & _
            "JOIN GD_RUID R ON R.ID = g.ID " & vbCrLf & _
            "JOIN GD_RUID r_ml on r_ml.ID = gg.id " & vbCrLf & _
            "where not (gg.name containing '00. Системное') " & vbCrLf & _
            "ORDER BY g_s_delchar(gg.alias), gg.name, g_s_delchar(g.alias), g.name "
        
          ibsql.ExecQuery
        
          Dim oArray : set oArray = new JSonArray
          dim oBody : set oBody = new JsonObject
        
          dim nameMenu, DishesGroupName
          dim oMenu, arrMenu, oGrName, arrGrName, oGoodName, arrGoodName, oValue
        
          set oMenu = new JsonObject
          set arrMenu = new JSonArray
          set arrGrName = new JSonArray
        
          set arrGoodName = new JSonArray
          set oGrName = new JsonObject
          set oGoodName = new JsonObject
        
          i = 0
          nameMenu = ""
          DishesGroupName = ""
        
          while not ibsql.eof
            if nameMenu <> ibsql.FieldByName("USR$NAME").AsString then
               if nameMenu <> "" then
                  if DishesGroupName <> "" then
                     Call oGrName.AddProperty_Object(DishesGroupName,arrGoodName)
                     call arrGrName.AddValue( oGrName )
                     set oGrName = new JsonObject
                     DishesGroupName = ""
                  end if
                  Call oMenu.AddProperty_Object(nameMenu,arrGrName)
                  call oArray.AddValue( oMenu )
                  set arrMenu = new JSonArray
                  set arrGrName = new JSonArray
                  set oMenu = new JsonObject
               end if
               nameMenu = ibsql.FieldByName("USR$NAME").AsString
               i = i + 1
        '       call oMenu.AddProperty_Object(i,arrMenu)
            end if
            if DishesGroupName <> ibsql.FieldByName("GRNAME").AsString then
               if DishesGroupName <> "" then
                  Call oGrName.AddProperty_Object(DishesGroupName,arrGoodName)
                  call arrGrName.AddValue( oGrName )
               end if
               set oGrName = new JsonObject
               set arrGoodName = new JSonArray
               DishesGroupName = ibsql.FieldByName("GRNAME").AsString
            end if
        
            set oValue = new JsonObject
            Call oValue.AddProperty_Simple("Изделие", ibsql.FieldByName("goodname").AsString)
            Call oValue.AddProperty_Simple("disabled", dctClmnVisible.Item(UCase("goodname")))
            call oGoodName.AddProperty_Object("Изделие", oValue)
        
            set oValue = new JsonObject
            Call oValue.AddProperty_Simple("Цена", formatNumber(ibsql.FieldByName("FullCost").AsCurrency, 2))
            Call oValue.AddProperty_Simple("disabled", dctClmnVisible.Item(UCase("FullCost")))
            Call oGoodName.AddProperty_Object("Цена", oValue)
        
            set oValue = new JsonObject
            Call oValue.AddProperty_Simple("Сумма скидки", ibsql.FieldByName("USR$SUMDISCOUNT").AsCurrency)
            Call oValue.AddProperty_Simple("disabled", true)
            call oGoodName.AddProperty_Object("Сумма скидки", oValue)
        
            set oValue = new JsonObject
            Call oValue.AddProperty_Simple("Сумма со скидкой", ibsql.FieldByName("USR$SUMWITHDISCOUNT").AsCurrency)
            Call oValue.AddProperty_Simple("disabled", dctClmnVisible.Item(UCase("USR$SUMWITHDISCOUNT")))
            call oGoodName.AddProperty_Object("Сумма со скидкой", oValue)
        
           ' Desciption Object
            set oValue = new JsonObject
            Call oValue.AddProperty_Simple("Описание",ibsql.FieldByName("outputStr").AsString)
            Call oValue.AddProperty_Simple("disabled", dctClmnVisible.Item(UCase("outputStr")))
            Call oGoodName.AddProperty_Object("Описание", oValue)
        
           'PHOTO Object
            set oValue = new JsonObject
            Call oValue.AddProperty_Simple("disabled", false)
            if Not IsNull(ibsql.FieldByName("PHOTO").AsVariant) then
              ibsql.FieldByName("PHOTO").SaveToStream(MStream)
              MStream.SaveToFile(folder & "\images\dishes\" & ibsql.FieldByName("RUID").AsString & ".jpg")
              MStream.Clear
              Call oValue.AddProperty_Simple("src", "\images\dishes\" & ibsql.FieldByName("RUID").AsString & ".jpg")
            else
              Call oValue.AddProperty_Simple("src", "\images\no_picture.jpg")
            end if
            Call oValue.AddProperty_Simple("disabled", dctClmnVisible.Item(UCase("PHOTO")))
            Call oGoodName.AddProperty_Object("PHOTO", oValue)
            
            set oValue = new JsonObject
            Call oValue.AddProperty_Simple("количество", ibsql.FieldByName("usr$quantity").AsCurrency)
            Call oValue.AddProperty_Simple("disabled", dctClmnVisible.Item(UCase("usr$quantity")))
            call oGoodName.AddProperty_Object("количество", oValue)
        
            set oValue = new JsonObject
            Call oValue.AddProperty_Simple("RUID_ML",ibsql.FieldByName("RUID_ML").AsString)
            Call oValue.AddProperty_Simple("disabled", true)
            Call oGoodName.AddProperty_Object("RUID_ML", oValue)
        
          '  call oArray.AddValue( oBody )
            call arrGoodName.AddValue( oGoodName )
            set oGoodName = new JsonObject
            ibsql.Next
          wend
        
          if nameMenu <> "" then
             Call oGrName.AddProperty_Object(DishesGroupName,arrGoodName)
             Call arrGrName.AddValue( oGrName )
             Call oMenu.AddProperty_Object(nameMenu,arrGrName)
             call oArray.AddValue( oMenu )
          end if
        
          Dim objStream
          Set objStream = CreateObject("ADODB.Stream")
          objStream.CharSet = "UTF-8" '"windows-1251"
          objStream.Open
          on error resume next
        
          objStream.WriteText(replace(oArray.JSON,"\\","/"))
          objStream.SaveToFile folder & "\source\menu.json", adSaveCreateOverWrite
        
          if err.description <> "" then
             call Application.MessageBox(err.description, "Внимание", vbOkOnly + vbInformation + vbSystemModal)
             objStream.Close
             exit function
          end if
          on error goto 0
          objStream.Close
          
          
          ibsql.Close
          ibsql.SQL.Text = _
           "select html.USR$TEXT, html.USR$PHOTO " & vbCrLf & _
           "from USR$HTML_SLIDER html where coalesce(html.USR$DISABLED,0) = 0 "
        
           ibsql.ExecQuery
           
           set arrGoodName = Nothing
           set arrGoodName = new JSonArray
           
           while not ibsql.eof
             set oGoodName = new JsonObject
             set oValue = new JsonObject
             Call oValue.AddProperty_Simple("text", ibsql.FieldByName("usr$text").AsString)
             ibsql.FieldByName("USR$PHOTO").SaveToStream(MStream)
             MStream.SaveToFile(folder & "\images\reklama\" & ibsql.RecordCount & ".jpg")
             MStream.Clear
             Call oValue.AddProperty_Simple("src", "\images\reklama\" & ibsql.RecordCount & ".jpg")
             Call oGoodName.AddProperty_Object(ibsql.RecordCount, oValue)
             Call arrGoodName.AddValue( oGoodName )
            ibsql.Next
           wend
        
           err.Clear
           on error resume next
           objStream.Open
           objStream.WriteText(replace(arrGoodName.JSON,"\\","/"))
           objStream.SaveToFile folder & "\source\reklama.json", adSaveCreateOverWrite
        
           if err.description <> "" then
             call Application.MessageBox(err.description, "Внимание", vbOkOnly + vbInformation + vbSystemModal)
             objStream.Close
             exit function
           end if
           on error goto 0
           objStream.Close
           
        
        
          Dim cbBrowserDefault, currentBrowser
          set cbBrowserDefault = Sender.GetComponent("usrg_cbBrowserDefault")
          currentBrowser = cbBrowserDefault.Text
        
          set oValue = new JsonObject
          Call oValue.AddProperty_Simple("IntervalServer", Int(pf_options.ServerInterval))
          Call oValue.AddProperty_Simple("ServerPort", Int(pf_options.ServerPort))
          Call oValue.AddProperty_Simple("currentBrowser", currentBrowser)
          
          objStream.Open
          on error resume next
        
          objStream.WriteText(replace(oValue.JSON,"\\","/"))
          objStream.SaveToFile folder & "\source\serverinterval.json", adSaveCreateOverWrite
          objStream.Close
        
          Dim value
          if IsEmpty(pf_options.ServerInterval) or pf_options.ServerInterval<=0 then
             value = InputDigitsForm("Интервал для обновления данных между монитором и Гедымин (мс)", 500)
             if Int(value)<=0 then value = 500
             Call GlobalStorage.ReadInteger("Option\HTMLServer", "ServerInterval", Int(value))
          end if
        
          if IsEmpty(pf_options.ServerPort) or pf_options.ServerPort<=0 then
             value = InputDigitsForm("Порт, на котором будет стартовать сайт", 5001)
             if Int(value)<=0 then value = 5001
             Call GlobalStorage.ReadInteger("Option\HTMLServer", "ServerPort", Int(value))
          end if
          
          if usrg_chkGitLoad.Checked and FSO.FolderExists(folder & "\.git") then
         '   call FSO.DeleteFolder(folder & "\.git", true)
          end if
          
          pf_options.HtmlServer = folder
          
          call CreateShortcut
          
        End Function
        
        Function InputDigitsForm(ByVal Caption, Value)
            InputDigitsForm = -1
            Dim Creator
            Set Creator = New TCreator
            Dim formName : formName = "usrf_pf_uds_InputDigits"
            Dim frm
            Set frm = Creator.GetObject(Null, formName, formName)
            frm.Position = 4
            frm.FindComponent("usrg_pnlTitle").Caption = Caption
        
            const m_Color_Title = -16777201
            ''' clBtnFace
            const m_Color_Main  = -16777201
            ''' clWindow
            const m_Color_Input = -16777211
        
            frm.Color = m_Color_Main
            frm.FindComponent("usrg_ceSum").Color = m_Color_Input
            frm.FindComponent("usrg_pnlTitle").Color = m_Color_Title
            frm.FindComponent("usrg_ceSum").Value = Int(Value)
        
            If Not frm.ShowModal = vbOk Then
              'Call Creator.DestroyAllObjects
              Exit Function
            End If
            InputDigitsForm = frm.FindComponent("usrg_ceSum").Value
            'Call Creator.DestroyAllObjects
        End Function
        
        Sub CreateShortCut
           ' Source - https://stackoverflow.com/a
        ' Posted by S22, modified by community. See post 'Timeline' for change history
        ' Retrieved 2026-01-09, License - CC BY-SA 3.0
        
          Dim objShell
          Set objShell = CreateObject("WScript.Shell")
          Dim strUserProfile
          strUserProfile = objShell.ExpandEnvironmentStrings("%USERPROFILE%")
        
          Set lnk = objShell.CreateShortcut(strUserProfile & "\Desktop\запуск монитора.LNK")
        
          lnk.TargetPath = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
        
          lnk.Arguments = ""
          lnk.Description = "запуск монитора"
          ' lnk.HotKey = "ALT+CTRL+F"
          ' lnk.IconLocation = strUserProfile & "\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\shutdown.bat, 2"
          lnk.IconLocation = "%SystemRoot%\SystemResources\shell32.dll.mun, 94"
          lnk.WindowStyle = "1"
          lnk.WorkingDirectory = "C:\Program Files (x86)\Google\Chrome\Application"
          lnk.Save
          Set lnk = Nothing
        
        End Sub
        
        
        
        
