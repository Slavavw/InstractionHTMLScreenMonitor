          Public Function RoundCost(Cost)
            Dim R
            R = CheckRound
            'If IsEmpty(R) or (R = 0) then R = 10
        '    If FPrecisionRound > 0 Then
        '      RoundCost = Round(Cost, FPrecisionRound)
        '      Exit Function
        '    End If
            
            If Cost >= 0 then
              RoundCost = Round(Cost / R + 0.0000000001) * R
            Else
              RoundCost = Round(Cost / R - 0.0000000001) * R
            End If
          End Function
          
          Public Function Precision(value)
            Dim R
            R = 3'FPrecisionRound
            If IsEmpty(R) or (R = 0) then R = 3
            If value >= 0 then
              Precision = Round(value * 10^R + 0.0000000001) / 10^R
            Else
              Precision = Round(value * 10^R - 0.0000000001) / 10^R
            End If
          End Function
        
          Public Function TrimGoodName(GoodName, ShortGoodName)
            If FPrintShortName and ShortGoodName <> "" then
              TrimGoodName = Left(ShortGoodName, QSymbol)
            Else
              TrimGoodName = Left(GoodName, QSymbol)
            End If
        
          End Function
        
        End Class
        
