                  Call pf_btnAvResult_Click(Sender)
        
                  Call ecr_PD.PutGood(gdcDetailObject.FieldByName("USR$NAME").AsString, _
                                gdcDetailObject.FieldByName("USR$QUANTITY").AsCurrency, _
                                gdcDetailObject.FieldByName("USR$PRICESALE").AsCurrency, _
                                gdcObject.FieldByName("USR$SUMCHECK").AsCurrency, _
                                False)
                End If
              End If
            Else
              'Call Application.MessageBox("В чеке нет позиций!", "Внимание", mb_Ok or vbSystemModal or mb_IconError)
              Call pf_ShowErrorMessage("В чеке нет позиций!")
              Call pf_ActionsList.AddToLog(16, Sender.OwnerForm.gdcObject.ID, Null, Null, "В чеке нет позиций", 1)
