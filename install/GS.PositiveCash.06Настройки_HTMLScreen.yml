      ENTEREDPARAMS: !!binary > 
        U0xQUlBSU1QNAAAAU1RSSU5HQkFSQ09ERQ0AAABTVFJJTkdCQVJDT0RFAAAAAAAAAAAAAAAAAAAA
        AAAAAAAAAAAAAEZOU1RQUlNUCwAAAFRSQU5TQUNUSU9OCwAAAFRSQU5TQUNUSU9OAAAAAAAAAAAA
        AAAAAAAAAAAAAAAAAAAAAEZOU1RGTFBS
      SCRIPT: | 
        Option Explicit
        Function pf_FindDiscountCardByCode(StringBarCode, Transaction)
          dim T
          if Assigned(Transaction) then
            if Transaction.Active then
              set T = Transaction
            else
              set T = gdcBaseManager.ReadTransaction
            end if
          else
            set T = gdcBaseManager.ReadTransaction
          end if
        
          dim Creator
          set Creator = new TCreator
        
          dim qCard
          set qCard = Creator.GetObject(nil, "TIBSQL", "pfFindDiscountCardByCode")
          qCard.Transaction = T
          qCard.SQL.Text = _
            "SELECT ID FROM USR$PF_DISCOUNTCARD WHERE USR$CODE = :CODE"
          qCard.ParamByName("CODE").AsString = StringBarCode
          qCard.ExecQuery
        
          if qCard.Eof then
            pf_FindDiscountCardByCode = false
          else
            pf_FindDiscountCardByCode = true
          end if
        
        End function
        
